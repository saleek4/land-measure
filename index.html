<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#16211a;--mut:#5d6b61;--line:#dfe5df;--acc:#1f7a4d;--accInk:#fff;--warn:#b7791f;--bad:#c0392b;--good:#1f7a4d;--soft:#e8f2ec;--fill:rgba(31,122,77,.16)}

.mtb{display:flex;gap:8px}

.mcard button.chip{padding:5px 10px;border-radius:14px;font-size:13px}.mcard button.chip.on{background:#1f7a4d;color:#fff}

.edp{display:flex;gap:10px;align-items:flex-start;margin-top:8px}.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,38px);gap:4px;flex:0 0 auto}.dpad button{padding:0;font-size:18px}.edc{flex:1;min-width:0}
.mcard .row button.danger{color:#b3261e}.mcard .bar{background:#dfe5df}.mcard .bar>i{background:#1f7a4d}

<header><div class="ttl">Land Alavu</div><button id="gpsChip" class="chip off">GPS off</button></header>
<main id="app"></main>
<nav>
  <button data-tab="measure"><b>&#127968;</b>Home</button>
  <button data-tab="map"><b>&#128752;&#65039;</b>Map</button>

<script>
// <MATH>
var A_=6378137,E2=0.00669437999014,DEG=Math.PI/180;

function startGPS(quiet){
  if(!('geolocation' in navigator)){if(!quiet)toast('This browser has no GPS support');return}
  if(S.gps.watching){if(!quiet)S.gps.quiet=false;return}
  S.gps.quiet=!!quiet;
  S.gps.err=null;S.gps.watching=true;
  S.gps.id=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  updateChip();
}
function stopGPS(){if(S.gps.id!=null)navigator.geolocation.clearWatch(S.gps.id);S.gps.id=null;S.gps.watching=false;S.gps.acc=null;updateChip()}

  var c=p.coords,g=S.gps;g.err=null;g.lat=c.latitude;g.lon=c.longitude;g.acc=c.accuracy;g.rx=Date.now();
  var smp={lat:c.latitude,lon:c.longitude,acc:c.accuracy,ts:p.timestamp,
    alt:(typeof c.altitude==='number'&&isFinite(c.altitude))?c.altitude:null,
    altAcc:(typeof c.altitudeAccuracy==='number'&&isFinite(c.altitudeAccuracy))?c.altitudeAccuracy:null};
  if(S.cap&&c.accuracy<=S.settings.maxAcc&&p.timestamp!==S.cap.lastTs){
    S.cap.lastTs=p.timestamp;
    if(isMoving())S.cap.moved++;else S.cap.samples.push(smp);
  }
  if(S.walk&&c.accuracy<=S.settings.maxAcc&&p.timestamp!==S.walk.lastTs){
    S.walk.lastTs=p.timestamp;var w=S.walk,last=w.pts[w.pts.length-1];
    if(!last){w.pts.push(smp)}else{var d=dist(last,smp);if(d>=1.0){w.pts.push(smp);w.len+=d}}
  }
  updateChip();updateLive();
  if(S.tab==='map'){if(M.follow){M.follow=false;locate()}else scheduleDraw()}
  else if(S.tab==='measure')mmSched();
}
function onErr(e){
  var g=S.gps;g.err=e.code;
  if(e.code===1){stopGPS();g.err=1;updateChip();if(!g.quiet)sheet('<h3>Location is blocked</h3><div class="mut">On iPhone: Settings &rarr; Privacy &amp; Security &rarr; Location Services &rarr; Safari Websites (or this app) &rarr; <b>While Using</b>, and keep <b>Precise Location</b> ON. Then reopen this app and tap the GPS button.</div><div class="row"><button class="pri" onclick="document.getElementById(\'ov\').classList.remove(\'on\')">OK</button></div>')}
  else updateChip();
}
function gpsState(){
  var g=S.gps;
  if(!g.watching)return{t:'GPS off · tap',c:'off'};

    if(drawn)hh+='<div class="mut small" style="margin-top:8px">This plot is already drawn from tape lengths. Change a number to correct it, then put it on the map again.</div>';

    hh+='</div>';
    if(cr.length){
      hh+='<div style="margin-top:12px"><b>3 &middot; Measure the crosses</b> <span class="mut small">only '+cr.length+' needed for '+n+' corners</span></div>'

        +'<div class="row" style="margin-top:6px"><button id="fBest">Suggest the best corner</button></div>'
        +'<div class="mut small" id="fHint" style="margin-top:4px">'+esc(hint)+'</div>'

      var el=$('#'+id);if(!el)return;var v=num0(val);if(!(v>0)){el.textContent='';return}

      if(r.warn)out+='<div class="warnbox">'+esc(r.warn)+'</div>';

      el.innerHTML=out+'</div>';

        var pr=fpLen(r.P[T.ck.a],r.P[T.ck.b]),ms=v*f(),df=ms-pr,tl=fpCheckTol(pr),ab=Math.abs(df),

  M.sel=-1;M.ring=-1;M.mv=false;closePop();splitRecalc();M.lastPanel='';mapBottom();

function closeSplit(){M.split=null;M.lastPanel='';mapBottom();scheduleDraw()}
function splitCfg(sp){
  var c={dir:sp.dir,ref:sp.ref},v=sp.vals;
  if(sp.kind==='equal')c.n=sp.nn;
  else if(sp.kind==='ratio')c.ratio=parseNums(v.ratio);
  else if(sp.kind==='areas')c.areas=parseNums(v.areas).map(function(x){return toSqm(x,S.settings.unit)});
  else{c.dir='par';c.widths=parseNums(v.width).map(function(x){return inFt()?x/FT:x})}
  return c;
}
function splitRecalc(){
  var sp=M.split,cfg=splitCfg(sp),err='';
  if(sp.kind==='ratio'&&cfg.ratio.length<2)err='Type two or more numbers, like 1:2 or 1:1:2';
  else if(sp.kind==='areas'&&(!cfg.areas.length||cfg.areas.some(function(x){return!(x>0)})))err='Type the size of each part except the last, like 10 or 10, 5';
  else if(sp.kind==='road'&&(!cfg.widths.length||!(cfg.widths[0]>0)))err='Type the road width in '+(inFt()?'feet':'metres');
  sp.res=null;sp.geo=null;sp.cutGeo=null;sp.err=err;
  if(!err){
    var r=splitCompute(sp.an.P,sp.an.H,cfg);
    if(r.ok){var an=sp.an;sp.res=r;
      sp.geo=r.parts.map(function(pt){return pt.poly.map(function(q){return fromXY(q.x,q.y,an.lat0,an.lon0)})});
      sp.cutGeo=r.cuts.map(function(c){return{a:fromXY(c.a.x,c.a.y,an.lat0,an.lon0),b:fromXY(c.b.x,c.b.y,an.lat0,an.lon0),len:c.len}});
    }else sp.err=r.err;

function saveParts(){
  var sp=M.split,res=sp.res,an=sp.an;if(!res)return;
  var o=cobj(),mode=o.mode||'corners',accs=o.corners.map(function(c){return c.acc||3}).sort(function(a,b){return a-b}),med=accs[Math.floor(accs.length/2)]||1;
  var nm=(o.name||'Plot').trim()||'Plot',made=[],hs=o.holes||[],HX=an.H;
  res.parts.forEach(function(pt,i){
    if(pt.poly.length<3)return;
    var corners=pt.poly.map(function(q){
      var j=-1;for(var k=0;k<an.P.length;k++){if(Math.abs(an.P[k].x-q.x)<1e-4&&Math.abs(an.P[k].y-q.y)<1e-4){j=k;break}}
      if(j>=0){var c=clone(o.corners[j]);delete c.note;delete c.ph;return c}
      var g=fromXY(q.x,q.y,an.lat0,an.lon0);return{lat:g.lat,lon:g.lon,acc:med,n:1,total:1,alt:null,altAcc:null,src:'cut'};
    });
    var holes=[];HX.forEach(function(H,hi){var c=centroid(H);if(pointInPoly(c,pt.poly))holes.push(clone(hs[hi]))});
    made.push({name:nm+' - part '+(i+1),place:o.place||'',notes:'Split from '+nm+' ('+fa(pt.area,S.settings.unit)+' '+UNIT[S.settings.unit].l+')',mode:mode,corners:corners,holes:holes});
  });
  var go=function(del){
    var base=Date.now();

function summary(p,an){
  var k=haAre(an.net),t=p.name+(p.place?' ('+p.place+')':'')+'\nDate: '+fdate(p.ts)+'\n';
  t+='Area: '+fa(an.net,'cent')+' cent = '+fa(an.net,'acre')+' acre = '+fa(an.net,'sqm')+' sq m = '+fa(an.net,'sqft')+' sq ft\n';
  if(an.holeArea>0)t+='Plot '+fa(an.area,'cent')+' cent, excluded '+fa(an.holeArea,'cent')+' cent ('+an.H.length+' area'+(an.H.length===1?'':'s')+' such as house or pond)\n';
  var rc=p.rec&&recCmp(an.net,an.sig,p.rec);
  if(rc)t+='Record area: '+fa(p.rec.a,p.rec.u)+' '+UNIT[p.rec.u].l+'. Measured is '+(rc.pct>0?'+':'-')+Math.abs(rc.pct).toFixed(1)+'% ('+(rc.within?'within':'more than')+' the measuring error)\n';
  t+='Method: '+(an.meth==='map'?'traced on satellite map (no GPS)':an.meth==='tape'?'tape lengths':an.meth==='mixed'?'GPS + satellite map':'phone GPS')+'\n';
  t+='Kerala style: '+k.ha+' Ha '+k.are+' Ar '+k.m2.toFixed(1)+' m2\nPerimeter: '+fl(an.per,1)+'\nEstimated error: +/-'+an.sig.toFixed(1)+' sq m ('+(an.rel*100).toFixed(1)+'%)\n';
  if(an.ngps>0&&an.slope&&an.slope.ok)t+=an.slope.detectable?('Slope: about '+an.slope.slopeDeg.toFixed(0)+' deg, downhill '+compass8(an.slope.aspect)+'; area along the slope '+fa(an.surface,'cent')+' cent\n'):('Slope: none detected (under ~'+Math.round(an.slope.limitDeg)+' deg)\n');
  if(p.notes)t+='Notes: '+p.notes+'\n';
  t+='Corners (lat, lon, accuracy):\n'+p.corners.map(function(c,i){return(i+1)+': '+c.lat.toFixed(7)+', '+c.lon.toFixed(7)+' ('+srcLabel(c).replace(' ',', ')+'+/-'+fl(c.acc,1)+')'+(c.note?' - '+c.note:'')}).join('\n');
  return t;
}
function geojson(plots){
  var ring=function(C){var r=C.map(function(c){return[+c.lon.toFixed(8),+c.lat.toFixed(8)]});r.push(r[0]);return r};
  return JSON.stringify({type:'FeatureCollection',features:plots.map(function(p){var rings=[ring(p.corners)];(p.holes||[]).forEach(function(h){if(h.corners&&h.corners.length>=3)rings.push(ring(h.corners))});return{type:'Feature',properties:{name:p.name,place:p.place,notes:p.notes,area_sqm:+p.area.toFixed(2),area_cent:+UNIT.cent.f(p.area).toFixed(3),perimeter_m:+p.per.toFixed(2),record_sqm:p.rec?+p.rec.a.toFixed(2):null,method:p.src==='map'?'satellite map':p.src==='tape'?'tape lengths':p.src==='mixed'?'gps+map':'gps',date:new Date(p.ts).toISOString()},geometry:{type:'Polygon',coordinates:rings}}})},null,1);
}

function wrapText(x,text,maxW){var words=String(text).split(/\s+/),lines=[],cur='';words.forEach(function(w){var t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t});if(cur)lines.push(cur);return lines}
function planCanvas(p,an,pw,ph){

  x.textAlign='center';x.fillStyle='#5d6b61';x.font='700 30px '+F;x.fillText('N',bx+bw-50,by+48);x.beginPath();x.moveTo(bx+bw-50,by+60);x.lineTo(bx+bw-50,by+120);x.moveTo(bx+bw-50,by+60);x.lineTo(bx+bw-62,by+80);x.moveTo(bx+bw-50,by+60);x.lineTo(bx+bw-38,by+80);x.lineWidth=4;x.strokeStyle='#5d6b61';x.stroke();
  var kk=inFt()?FT:1,steps=[1,2,5,10,20,50,100,200,500,1000],L=steps[0];steps.forEach(function(v){if(v/kk*f.sc<=bw*0.3)L=v});

function planBlob(p,an,kind){

    if(kind==='png')cv.toBlob(function(b){b?res(b):rej(new Error('png'))},'image/png');
    else{var url=cv.toDataURL('image/jpeg',0.92),bin=atob(url.split(',')[1]),u8=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);res(new Blob([pdfFromJpeg(u8,1240,1754,595,842)],{type:'application/pdf'}))}
  });
}
function fileBase(p){return(p.name.replace(/[^\w\-]+/g,'_')||'plot')}
function renderDetail(p){

  if(p.tape&&p.tape.sides)h+='<div class="card"><h2>Tape lengths</h2><div class="small">Sides: '+p.tape.sides.map(function(v,i){return(i+1)+'→'+((i+1)%p.tape.sides.length+1)+' <b>'+esc(v)+'</b>'}).join(' · ')+(p.tape.diags&&p.tape.diags.length?'<br>Crosses: '+(p.tape.cr||tapeCross(p.tape.sides.length,(p.tape.hub||0)%p.tape.sides.length)).map(function(c,i){return(c[0]+1)+'→'+(c[1]+1)+' <b>'+esc(p.tape.diags[i])+'</b>'}).join(' · '):'')+' ('+(p.tape.u==='ft'?'feet':'metres')+')</div></div>';
  h+='<div class="card"><h2>Corners</h2><table>'+p.corners.map(function(c,i){return'<tr><td>'+(i+1)+'</td><td style="font-weight:400;font-size:13px">'+c.lat.toFixed(6)+', '+c.lon.toFixed(6)+' · '+srcLabel(c)+'±'+fl(c.acc,1)+(c.note?'<div style="font-weight:600;margin-top:2px">'+esc(c.note)+'</div>':'')+(c.ph&&c.ph.length?'<div class="thumbs" data-ph="'+i+'"></div>':'')+'</td></tr>'}).join('')+'</table></div>';
  if(an.H.length)h+='<div class="card"><h2>Excluded areas</h2><table>'+an.H.map(function(H,i){return'<tr><td>Area '+(i+1)+'</td><td>'+fa(shoelace(H),u)+' '+UNIT[u].l+'</td></tr>'}).join('')+'</table></div>';
  h+='<button class="pri" id="bMap" style="width:100%;margin-bottom:8px">&#128752;&#65039; View on satellite map</button>';
  h+='<div class="row"><button id="bSplit">&#9986; Split</button><button id="bRec">&#128203; Record area</button></div>';

function renderMore(){
  var st=S.settings;
  var opt=function(vals,cur,lab){return vals.map(function(v){return'<option value="'+v+'"'+(String(cur)===String(v)?' selected':'')+'>'+(lab?lab(v):v)+'</option>'}).join('')};
  var h=acctCardHTML()+'<div class="card"><h2>Settings</h2><label>Averaging time per corner</label><select id="sDur">'+opt([15,30,45,60,90],st.dur,function(v){return v+' seconds'})+'</select>';
  h+='<label>Ignore GPS readings worse than</label><select id="sAcc">'+opt([8,12,20,30,50],st.maxAcc,function(v){return'±'+fl(v,0)})+'</select>';
  h+='<label>Main area unit</label><select id="sUnit"><option value="cent"'+(st.unit==='cent'?' selected':'')+'>cent</option><option value="acre"'+(st.unit==='acre'?' selected':'')+'>acre</option><option value="sqm"'+(st.unit==='sqm'?' selected':'')+'>sq m</option><option value="sqft"'+(st.unit==='sqft'?' selected':'')+'>sq ft</option></select>';
  h+='<label>Length unit (distances, sides, perimeter)</label><select id="sLU"><option value="m"'+(st.lunit!=='ft'?' selected':'')+'>metres (m)</option><option value="ft"'+(st.lunit==='ft'?' selected':'')+'>feet (ft)</option></select></div>';
  h+='<div class="card"><h2>Backup</h2><div class="mut small">Saved plots live only on this phone, inside this app. <b>If you delete the Home Screen icon, or clear Safari website data, every saved plot is erased.</b> Photos are not in the backup file. Last backup: '+backupAgo()+'.</div>'+(isIOS()&&!isStandalone()?'<div class="small" style="margin-top:6px">You are in a Safari tab now. It keeps its own plots, separate from the Home Screen icon.</div>':'')+'<div class="row" style="margin-top:10px"><button id="bExp" class="pri">Back up all plots</button><button id="bImp">Import</button></div><div class="row" style="margin-top:8px"><button id="bGeoAll">All as GeoJSON</button><button id="bKmlAll">All as KML</button></div><div class="mut small" style="margin-top:8px">'+S.plots.length+' plot'+(S.plots.length===1?'':'s')+' saved. Photos of points stay on this phone and are not in the backup file.</div></div>';
  h+='<div class="card"><h2>How accurate is this?</h2><div class="small">Phone GPS alone is usually off by about 1 to 5 m in the open, and worse under trees or next to buildings. The error in the area depends on plot size:</div><ul class="tips small"><li><b>Acres:</b> usually around 1% or better. Fine for estimates.</li><li><b>10 to 50 cent:</b> a few percent. Rough.</li><li><b>1 to 10 cent:</b> error is too big. Use tape or a laser distance meter.</li></ul><div class="small" style="margin-top:8px">This is not centimetre accuracy and not a legal survey. For that you need an RTK GNSS receiver or a licensed surveyor.</div><div class="small" style="margin-top:8px"><b>Sloping land:</b> the main number is the flat map (horizontal) area. The app also estimates the slope from GPS height. A web app cannot read the iPhone barometer or LiDAR, so small slopes are not detected.</div></div>';
  h+='<div class="card"><h2>Satellite map</h2><ul class="tips small"><li>The <b>Map</b> tab shows satellite pictures (Esri). Tap to add points, drag a point to correct it, and the distances, perimeter and area show at the top.</li><li><b>No GPS needed.</b> Points placed on the map give an approximate area. This is as good as the picture: sharp, recent and not hidden by trees. Boundaries under trees are guesses.</li><li>Use <b>Centre pin</b> for careful work: move the map until the cross is on the corner, then tap Add point.</li><li>The pictures need internet. Measuring with GPS works without it.</li><li>Some villages have no sharp satellite picture at the highest zoom. The app then shows the best lower level it can find. You can also set the sharpest level in the map options (the three-line button).</li></ul></div>';
  h+='<div class="card"><h2>More tools (Map tab &rarr; Tools)</h2><ul class="tips small"><li><b>Split:</b> divide a plot into equal parts, by ratio, by cents, or with a road strip. Ideas are shown as small pictures. Save the parts as separate plots.</li><li><b>Exclude an area:</b> mark a house or pond. Its area is taken out and the net area is shown.</li><li><b>Record area:</b> type the area from the deed or Ente Bhoomi to see the difference in %.</li><li><b>Tape lengths:</b> type the side lengths and the crosses (tapes straight across the plot) and the app draws the plot and works out the area. It tells you the fewest crosses needed (corners &minus; 3). Tap a corner to take the crosses from it, or let the app suggest the best corner. A tape is far more exact than GPS for small plots.</li><li><b>Magnifier:</b> when you drag a point, a round magnifier shows the spot above your finger.</li><li><b>Point notes and photos:</b> tap a point to add a note or a photo.</li><li>On a saved plot you can make a <b>plan PDF</b>, a picture, or a <b>KML</b> file for Google Earth.</li></ul></div>';
  h+='<div class="card"><h2>Tips for best results</h2><ul class="tips small"><li>Stand in the open, away from trees, walls and vehicles.</li><li>Wait until the GPS chip at the top shows green or amber before you capture.</li><li>Take all corners in one session, within about 15 minutes. Common GPS errors then cancel out in the area.</li><li>Take corners in order around the plot (clockwise or anticlockwise).</li><li>Keep the phone steady and the screen on. The app asks the phone to stay awake.</li><li>Measure again on another day or time of day and compare. If the two areas differ, trust neither fully.</li></ul></div>';
  h+='<div class="card"><h2>Install on iPhone</h2><ul class="tips small"><li>Open this page in Safari, tap Share, then <b>Add to Home Screen</b>.</li><li>Always open it from the home screen icon. Data saved in a Safari tab is not shared with the icon.</li><li><b>Do not delete the icon.</b> Deleting it erases the plots saved inside it. Back up first (More tab, Backup).</li><li>Allow Location when asked. In iPhone Settings, keep <b>Precise Location</b> ON for this app.</li></ul></div>';
  $('#app').innerHTML=h;
  acctBind();
  $('#sDur').onchange=function(){st.dur=+this.value;saveSettings()};
  $('#sAcc').onchange=function(){st.maxAcc=+this.value;saveSettings()};
  $('#sUnit').onchange=function(){st.unit=this.value;saveSettings()};
  $('#sLU').onchange=function(){st.lunit=this.value;saveSettings();renderMore()};
  $('#bExp').onclick=function(){backupNow(function(){toast('Backup saved. Keep that file safe');renderMore()})};
  $('#bGeoAll').onclick=function(){if(!S.plots.length){toast('No plots yet');return}share('Land plots GeoJSON',geojson(S.plots),'land-plots.geojson','application/geo+json')};
  $('#bKmlAll').onclick=function(){if(!S.plots.length){toast('No plots yet');return}share('Land plots KML',kmlOf(S.plots),'land-plots.kml','application/vnd.google-earth.kml+xml')};
  $('#bImp').onclick=function(){
    sheet('<h3>Import backup</h3><div class="mut small">Pick the backup .json file, or paste its text below.</div><input type="file" id="iFile" accept=".json,application/json" style="margin-top:10px"><textarea id="iTxt" placeholder="Paste backup text here" style="margin-top:10px"></textarea><div class="row"><button class="pri" id="iOk">Import</button><button id="iNo">Cancel</button></div>');
    $('#iNo').onclick=closeSheet;
    $('#iFile').onchange=function(){var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('#iTxt').value=r.result};r.readAsText(f)};
    $('#iOk').onclick=function(){
      try{var j=JSON.parse($('#iTxt').value),arr=Array.isArray(j)?j:j.plots;if(!Array.isArray(arr))throw 0;
        var have={};S.plots.forEach(function(p){have[p.id]=1});var add=0;
        arr.forEach(function(p){if(p&&p.id&&Array.isArray(p.corners)&&p.corners.length>=3&&!have[p.id]){allRings(p).forEach(function(r){r.forEach(function(c){delete c.ph})});S.plots.push(p);add++}});
        S.plots.sort(function(a,b){return b.ts-a.ts});savePlots();closeSheet();toast('Imported '+add+' plot'+(add===1?'':'s'));renderMore();
      }catch(e){toast('That is not a valid backup')}
    };
  };
}
