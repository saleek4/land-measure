<title>Land Measure</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#16211a;--mut:#5d6b61;--line:#dfe5df;--acc:#1f7a4d;--accInk:#fff;--warn:#b7791f;--bad:#c0392b;--good:#1f7a4d;--soft:#e8f2ec;--fill:rgba(31,122,77,.16)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1511;--card:#18211b;--ink:#e8efe9;--mut:#9fb0a4;--line:#2a372e;--acc:#3fb37a;--accInk:#06150d;--warn:#e0a84a;--bad:#ef6b5b;--good:#3fb37a;--soft:#1e2c23;--fill:rgba(63,179,122,.2)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
header .ttl{font-weight:700;font-size:19px}
main{padding:12px 14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:15px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:90px;resize:vertical}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--soft);color:var(--ink);font-weight:600;cursor:pointer}
button.pri{background:var(--acc);color:var(--accInk)}
button.big{width:100%;padding:18px 16px;font-size:18px}
button.danger{color:var(--bad)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.chip{border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;background:var(--soft);color:var(--ink)}
.chip.good{background:var(--good);color:var(--accInk)}.chip.warn{background:var(--warn);color:#fff}.chip.bad{background:var(--bad);color:#fff}.chip.off{background:var(--line);color:var(--mut)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;background:transparent;padding:9px}.seg button.on{background:var(--acc);color:var(--accInk)}
.corners{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.corners button{padding:7px 11px;font-size:14px;border-radius:999px}
.mut{color:var(--mut);font-size:14px}
.small{font-size:13px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.big-num{font-size:34px;font-weight:800;letter-spacing:-.02em}
.big-num small{font-size:16px;font-weight:600;color:var(--mut)}
table{width:100%;border-collapse:collapse;margin-top:8px}
td{padding:6px 0;border-top:1px solid var(--line);font-size:15px}td:last-child{text-align:right;font-weight:600}
.tag{display:inline-block;border-radius:8px;padding:3px 9px;font-size:13px;font-weight:700;color:#fff}
.tag.good{background:var(--good)}.tag.warn{background:var(--warn)}.tag.bad{background:var(--bad)}
.warnbox{background:rgba(192,57,43,.12);border:1px solid var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
svg.plot{width:100%;height:auto;display:block;background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-top:10px}
.plotitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);margin-bottom:10px;padding:13px 14px;border-radius:14px;font-weight:400}
.plotitem b{font-size:17px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:transparent;border-radius:10px;padding:9px 4px;font-size:13px;color:var(--mut)}
nav button b{display:block;font-size:20px;line-height:1.1}
nav button.on{color:var(--acc)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.on{display:flex}
#sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
#sheet h3{margin:0 0 6px}
#sheet .row{margin-top:12px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#222;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;z-index:30;display:none;max-width:90%;text-align:center}
ul.tips{margin:6px 0 0;padding-left:20px}ul.tips li{margin:6px 0}
</style>

<body>
<header><div class="ttl">Land Measure</div><button id="gpsChip" class="chip off">GPS off</button></header>

  <button data-tab="measure"><b>&#128205;</b>Measure</button>

<script>
// <MATH>
var A_=6378137,E2=0.00669437999014,DEG=Math.PI/180;
function radii(latDeg){var s=Math.sin(latDeg*DEG),w=1-E2*s*s,N=A_/Math.sqrt(w),M=A_*(1-E2)/(w*Math.sqrt(w));return{N:N,M:M}}
function toXY(pts,lat0,lon0){var r=radii(lat0),c=Math.cos(lat0*DEG);return pts.map(function(p){return{x:(p.lon-lon0)*DEG*r.N*c,y:(p.lat-lat0)*DEG*r.M}})}
function fromXY(x,y,lat0,lon0){var r=radii(lat0),c=Math.cos(lat0*DEG);return{lat:lat0+y/r.M/DEG,lon:lon0+x/(r.N*c)/DEG}}
function dist(a,b){var r=radii(a.lat);return Math.hypot((b.lon-a.lon)*DEG*r.N*Math.cos(a.lat*DEG),(b.lat-a.lat)*DEG*r.M)}
function shoelace(P){var s=0;for(var i=0;i<P.length;i++){var a=P[i],b=P[(i+1)%P.length];s+=a.x*b.y-b.x*a.y}return Math.abs(s)/2}
function orient(a,b,c){return(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x)}
function segInt(p1,p2,p3,p4){var d1=orient(p3,p4,p1),d2=orient(p3,p4,p2),d3=orient(p1,p2,p3),d4=orient(p1,p2,p4);return((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0))}
function selfCross(P){var n=P.length;if(n<4)return false;for(var i=0;i<n;i++){for(var j=i+1;j<n;j++){if(j===i+1||(i===0&&j===n-1))continue;if(segInt(P[i],P[(i+1)%n],P[j],P[(j+1)%n]))return true}}return false}
// Fit a plane z = a*x + b*y + c through corner altitudes (weighted by altitude accuracy).
// Returns slope in degrees (noise-corrected), whether it is detectable above the GPS height noise,
// the surface-area factor sqrt(1+g^2) and the downhill compass bearing.
function slopeFit(C,P){
  var pts=[];
  for(var i=0;i<C.length;i++){var z=C[i].alt;if(typeof z==='number'&&isFinite(z)){var s=C[i].altAcc;pts.push({x:P[i].x,y:P[i].y,z:z,s:Math.max(s>0?s:5,1)})}}
  if(pts.length<3)return{ok:false,why:'no-alt'};
  var sw=0,mx=0,my=0,mz=0;
  pts.forEach(function(p){p.w=1/(p.s*p.s);sw+=p.w;mx+=p.w*p.x;my+=p.w*p.y;mz+=p.w*p.z});
  mx/=sw;my/=sw;mz/=sw;
  var sxx=0,sxy=0,syy=0,sxz=0,syz=0;
  pts.forEach(function(p){var dx=p.x-mx,dy=p.y-my,dz=p.z-mz;sxx+=p.w*dx*dx;sxy+=p.w*dx*dy;syy+=p.w*dy*dy;sxz+=p.w*dx*dz;syz+=p.w*dy*dz});
  var det=sxx*syy-sxy*sxy;
  if(!(sxx>0&&syy>0)||det<1e-6*sxx*syy)return{ok:false,why:'shape'};
  var a=(sxz*syy-syz*sxy)/det,b=(syz*sxx-sxz*sxy)/det,va=syy/det,vb=sxx/det;
  var g2=a*a+b*b,n2=va+vb,g2d=Math.max(0,g2-n2),det2=g2>4*n2;
  return{ok:true,detectable:det2,slopeDeg:Math.atan(Math.sqrt(g2d))/DEG,noiseDeg:Math.atan(Math.sqrt(n2))/DEG,limitDeg:Math.atan(2*Math.sqrt(n2))/DEG,factor:det2?Math.sqrt(1+g2d):1,aspect:((Math.atan2(-a,-b)/DEG)+360)%360};
}
function compass8(deg){return['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8]}
// corners: [{lat,lon,acc,alt,altAcc}]; mode 'corners' (independent errors per corner) or 'walk' (correlated along the path)
function analyze(C,mode){
  if(!C||C.length<3)return null;
  var lat0=0,lon0=0;C.forEach(function(c){lat0+=c.lat;lon0+=c.lon});lat0/=C.length;lon0/=C.length;
  var P=toXY(C,lat0,lon0),area=shoelace(P),per=0,sides=[],n=P.length;
  for(var i=0;i<n;i++){var a=P[i],b=P[(i+1)%n],L=Math.hypot(b.x-a.x,b.y-a.y);sides.push(L);per+=L}
  var sig;
  if(mode==='walk'){var accs=C.map(function(c){return c.acc||3}).sort(function(a,b){return a-b});var med=accs[Math.floor(accs.length/2)];sig=(med/1.5)*Math.sqrt(2*10*per)}
  else{var v=0;for(var k=0;k<n;k++){var p=P[(k+n-1)%n],q=P[(k+1)%n],g2=((q.x-p.x)*(q.x-p.x)+(q.y-p.y)*(q.y-p.y))/4,sa=(C[k].acc||3)/1.5;v+=sa*sa*g2}sig=Math.sqrt(v)}
  var slope=slopeFit(C,P);
  return{area:area,per:per,sides:sides,sig:sig,rel:area>0?sig/area:1,cross:selfCross(P),P:P,lat0:lat0,lon0:lon0,slope:slope,surface:area*(slope.ok?slope.factor:1)};
}
function averageSamples(smp){
  var s=smp.slice().sort(function(a,b){return a.acc-b.acc});
  var keepN=Math.max(1,Math.ceil(s.length*0.7));s=s.slice(0,keepN);
  var lat0=s[0].lat,lon0=s[0].lon,P=toXY(s,lat0,lon0),sw=0,sx=0,sy=0;
  for(var i=0;i<s.length;i++){var w=1/Math.pow(Math.max(s[i].acc,1),2);sw+=w;sx+=w*P[i].x;sy+=w*P[i].y}
  var mx=sx/sw,my=sy/sw,v=0;
  for(var j=0;j<s.length;j++){var dx=P[j].x-mx,dy=P[j].y-my;v+=dx*dx+dy*dy}
  var spread=Math.sqrt(v/s.length),accs=s.map(function(a){return a.acc}).sort(function(a,b){return a-b});
  var med=accs[Math.floor(accs.length/2)],pos=fromXY(mx,my,lat0,lon0);
  var za=0,zw=0,zs=[];
  s.forEach(function(q){if(typeof q.alt==='number'&&isFinite(q.alt)){var sz=Math.max(q.altAcc>0?q.altAcc:5,1),w=1/(sz*sz);za+=w*q.alt;zw+=w;zs.push(sz)}});
  zs.sort(function(a,b){return a-b});
  return{lat:pos.lat,lon:pos.lon,acc:Math.max(spread,0.6*med,0.5),n:s.length,total:smp.length,alt:zw>0?za/zw:null,altAcc:zs.length?zs[Math.floor(zs.length/2)]:null};
}
function dp(pts,tol){
  if(pts.length<3)return pts.slice();
  var a=pts[0],b=pts[pts.length-1],md=-1,mi=-1,dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy);
  for(var i=1;i<pts.length-1;i++){var p=pts[i],d=L>1e-9?Math.abs(dy*(p.x-a.x)-dx*(p.y-a.y))/L:Math.hypot(p.x-a.x,p.y-a.y);if(d>md){md=d;mi=i}}
  if(md<=tol)return[a,b];
  var l=dp(pts.slice(0,mi+1),tol),r=dp(pts.slice(mi),tol);return l.slice(0,-1).concat(r);
}
function simplifyLoop(Q,tol){
  var fi=0,fd=-1;for(var i=1;i<Q.length;i++){var d=Math.hypot(Q[i].x-Q[0].x,Q[i].y-Q[0].y);if(d>fd){fd=d;fi=i}}
  var a=dp(Q.slice(0,fi+1),tol),b=dp(Q.slice(fi),tol);return a.concat(b.slice(1,-1));
}
function processWalk(pts){
  if(pts.length<8)return null;
  var lat0=pts[0].lat,lon0=pts[0].lon,P=toXY(pts,lat0,lon0),k=2;
  P.forEach(function(p,i){var z=pts[i].alt;p.z=(typeof z==='number'&&isFinite(z))?z:NaN});
  var Q=P.map(function(p,i){var sx=0,sy=0,sz=0,n=0,nz=0;for(var j=Math.max(0,i-k);j<=Math.min(P.length-1,i+k);j++){sx+=P[j].x;sy+=P[j].y;n++;if(isFinite(P[j].z)){sz+=P[j].z;nz++}}return{x:sx/n,y:sy/n,z:nz?sz/nz:NaN}});
  var accs=pts.map(function(p){return p.acc}).sort(function(a,b){return a-b}),med=accs[Math.floor(accs.length/2)];
  var zacc=pts.map(function(p){return p.altAcc}).filter(function(v){return v>0}).sort(function(a,b){return a-b}),medZ=zacc.length?zacc[Math.floor(zacc.length/2)]:5;
  var out=simplifyLoop(Q,Math.max(0.8,med*0.35));
  if(out.length<3)return null;
  return out.map(function(p){var g=fromXY(p.x,p.y,lat0,lon0),hz=isFinite(p.z);return{lat:g.lat,lon:g.lon,acc:med,n:1,alt:hz?p.z:null,altAcc:hz?medZ:null}});
}
var UNIT={cent:{l:'cent',f:function(a){return a/40.468564224}},acre:{l:'acre',f:function(a){return a/4046.8564224}},sqm:{l:'sq m',f:function(a){return a}},sqft:{l:'sq ft',f:function(a){return a*10.7639104167}}};
function haAre(a){var ha=Math.floor(a/10000),are=Math.floor((a-ha*10000)/100),m2=a-ha*10000-are*100;return{ha:ha,are:are,m2:m2}}
// </MATH>

(function(){
'use strict';
var $=function(s,r){return(r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var K={plots:'lm.plots.v1',settings:'lm.settings.v1',draft:'lm.draft.v1'};
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

var S={
  tab:'measure',viewId:null,filter:'',
  settings:Object.assign({dur:30,maxAcc:20,unit:'cent'},load(K.settings,{})),
  plots:load(K.plots,[]),
  draft:Object.assign({name:'',place:'',notes:'',mode:'corners',corners:[]},load(K.draft,{})),
  gps:{watching:false,id:null,lat:null,lon:null,acc:null,rx:0,err:null},
  motion:{on:false,asked:false,big:0},
  cap:null,walk:null,wake:null
};
function saveDraft(){store(K.draft,S.draft)}
function savePlots(){if(!store(K.plots,S.plots))toast('Could not save (storage full or blocked)')}
function saveSettings(){store(K.settings,S.settings)}

// ---------- formatting ----------
function num(v,d){return v.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fa(a,u){var v=UNIT[u].f(a);return u==='cent'?num(v,2):u==='acre'?num(v,4):u==='sqm'?num(v,1):num(v,0)}
function fdate(ts){var d=new Date(ts);return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function quality(rel){return rel<=0.01?{t:'Good',c:'good',d:'about ±1% or better'}:rel<=0.03?{t:'Fair',c:'warn',d:'about ±3%'}:rel<=0.08?{t:'Rough',c:'warn',d:'about ±5–8%'}:{t:'Too rough',c:'bad',d:'error is large for this plot size. Use tape or laser for small plots'}}

// ---------- toast / sheet ----------
var toastT=null;
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(function(){t.style.display='none'},2800)}
function sheet(html){$('#sheet').innerHTML=html;$('#ov').classList.add('on')}
function closeSheet(){$('#ov').classList.remove('on');$('#sheet').innerHTML=''}
$('#ov').addEventListener('click',function(e){if(e.target===this)closeSheet()});
function choose(title,msg,opts){return new Promise(function(res){
  sheet('<h3>'+esc(title)+'</h3><div class="mut">'+msg+'</div><div class="row">'+opts.map(function(o,i){return'<button data-i="'+i+'" class="'+(o.cls||'')+'">'+esc(o.label)+'</button>'}).join('')+'</div>');
  $('#sheet').onclick=function(e){var b=e.target.closest('button[data-i]');if(!b)return;var o=opts[+b.dataset.i];closeSheet();res(o.val)};
})}
function showText(title,text){
  sheet('<h3>'+esc(title)+'</h3><textarea id="shTxt" readonly style="min-height:200px;font-size:13px">'+esc(text)+'</textarea><div class="row"><button class="pri" id="shCopy">Copy</button><button id="shClose">Close</button></div>');
  $('#shClose').onclick=closeSheet;
  $('#shCopy').onclick=function(){var ta=$('#shTxt');ta.select();ta.setSelectionRange(0,999999);var ok=false;try{ok=document.execCommand('copy')}catch(e){}if(!ok&&navigator.clipboard){navigator.clipboard.writeText(text).then(function(){toast('Copied')},function(){toast('Select the text and copy')});return}toast(ok?'Copied':'Select the text and copy')};
}
function share(title,text,filename,mime){
  try{
    if(filename&&window.File&&navigator.canShare){var f=new File([text],filename,{type:mime||'text/plain'});if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:title}).catch(function(e){if(!e||e.name!=='AbortError')showText(title,text)});return}}
    if(navigator.share){navigator.share({title:title,text:text}).catch(function(e){if(!e||e.name!=='AbortError')showText(title,text)});return}
  }catch(e){}
  showText(title,text);
}

// ---------- GPS ----------
function startGPS(){
  if(!('geolocation' in navigator)){toast('This browser has no GPS support');return}
  if(S.gps.watching)return;
  S.gps.err=null;S.gps.watching=true;
  S.gps.id=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  updateChip();
}
function stopGPS(){if(S.gps.id!=null)navigator.geolocation.clearWatch(S.gps.id);S.gps.id=null;S.gps.watching=false;S.gps.acc=null;updateChip()}
function onPos(p){
  var c=p.coords,g=S.gps;g.err=null;g.lat=c.latitude;g.lon=c.longitude;g.acc=c.accuracy;g.rx=Date.now();
  var smp={lat:c.latitude,lon:c.longitude,acc:c.accuracy,ts:p.timestamp,
    alt:(typeof c.altitude==='number'&&isFinite(c.altitude))?c.altitude:null,
    altAcc:(typeof c.altitudeAccuracy==='number'&&isFinite(c.altitudeAccuracy))?c.altitudeAccuracy:null};
  if(S.cap&&c.accuracy<=S.settings.maxAcc&&p.timestamp!==S.cap.lastTs){
    S.cap.lastTs=p.timestamp;
    if(isMoving())S.cap.moved++;else S.cap.samples.push(smp);
  }
  if(S.walk&&c.accuracy<=S.settings.maxAcc&&p.timestamp!==S.walk.lastTs){
    S.walk.lastTs=p.timestamp;var w=S.walk,last=w.pts[w.pts.length-1];
    if(!last){w.pts.push(smp)}else{var d=dist(last,smp);if(d>=1.0){w.pts.push(smp);w.len+=d}}
  }
  updateChip();updateLive();
}
function onErr(e){
  var g=S.gps;g.err=e.code;
  if(e.code===1){stopGPS();g.err=1;updateChip();sheet('<h3>Location is blocked</h3><div class="mut">On iPhone: Settings &rarr; Privacy &amp; Security &rarr; Location Services &rarr; Safari Websites (or this app) &rarr; <b>While Using</b>, and keep <b>Precise Location</b> ON. Then reopen this app and tap the GPS button.</div><div class="row"><button class="pri" onclick="document.getElementById(\'ov\').classList.remove(\'on\')">OK</button></div>')}
  else updateChip();
}
function gpsState(){
  var g=S.gps;
  if(!g.watching)return{t:'GPS off · tap',c:'off'};
  if(g.err===2)return{t:'GPS unavailable',c:'bad'};
  if(g.acc==null||Date.now()-g.rx>10000)return{t:'Searching…',c:'warn'};
  return{t:'±'+g.acc.toFixed(1)+' m',c:g.acc<=3?'good':g.acc<=8?'warn':'bad'};
}
function updateChip(){var el=$('#gpsChip'),s=gpsState();el.className='chip '+s.c;el.textContent=s.t}
$('#gpsChip').onclick=function(){if(S.gps.watching){toast(S.gps.acc!=null?'GPS is on, accuracy ±'+S.gps.acc.toFixed(1)+' m':'Searching for GPS signal…')}else startGPS()};

// ---------- motion sensor (is the phone held still?) ----------
function startMotion(){
  var M=S.motion;if(M.on||M.asked||typeof DeviceMotionEvent==='undefined')return;
  var attach=function(){window.addEventListener('devicemotion',onMotion);M.on=true};
  try{
    if(typeof DeviceMotionEvent.requestPermission==='function'){M.asked=true;DeviceMotionEvent.requestPermission().then(function(r){if(r==='granted')attach();else M.asked=false}).catch(function(){M.asked=false})}
    else attach();
  }catch(e){}
}
function onMotion(e){var a=e.acceleration;if(!a||a.x==null)return;var m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);if(m>1.0)S.motion.big=Date.now()}
function isMoving(){return S.motion.on&&Date.now()-S.motion.big<1000}

// ---------- wake lock ----------
function wakeOn(){try{if('wakeLock' in navigator&&!S.wake){navigator.wakeLock.request('screen').then(function(l){S.wake=l;l.addEventListener('release',function(){S.wake=null})}).catch(function(){})}}catch(e){}}
function wakeOff(){try{if(S.wake)S.wake.release()}catch(e){}S.wake=null}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&(S.cap||S.walk))wakeOn()});

// ---------- capture ----------
function startCapture(replaceIdx){
  startMotion();startGPS();
  S.cap={samples:[],moved:0,t0:Date.now(),dur:S.settings.dur*1000,lastTs:0,replace:(typeof replaceIdx==='number')?replaceIdx:-1};
  wakeOn();renderMeasure();
}
function finishCapture(){
  var c=S.cap;if(!c)return;S.cap=null;wakeOff();
  if(!c.samples.length){toast(c.moved?'The phone kept moving. Hold it still and try again':'No usable GPS readings. Move to open sky and try again');renderMeasure();return}
  var corner=averageSamples(c.samples);
  if(c.replace>=0&&c.replace<S.draft.corners.length)S.draft.corners[c.replace]=corner;else S.draft.corners.push(corner);
  saveDraft();renderMeasure();
}
function cancelCapture(){S.cap=null;wakeOff();renderMeasure()}
function startWalk(){startGPS();S.walk={pts:[],len:0,t0:Date.now(),lastTs:0};wakeOn();renderMeasure()}
function finishWalk(){
  var w=S.walk;S.walk=null;wakeOff();
  var out=processWalk(w.pts);
  if(!out){toast('Not enough points. Walk the full boundary, then finish');renderMeasure();return}
  S.draft.corners=out;saveDraft();renderMeasure();
}
function cancelWalk(){S.walk=null;wakeOff();renderMeasure()}

function updateLive(){
  if(S.cap){
    var el=(Date.now()-S.cap.t0),f=Math.min(1,el/S.cap.dur),b=$('#capbar'),t=$('#captxt');
    if(b)b.style.width=(f*100)+'%';
    if(t){var best=S.cap.samples.length?Math.min.apply(null,S.cap.samples.map(function(s){return s.acc})):null;
      t.textContent=Math.min(S.settings.dur,Math.floor(el/1000))+' / '+S.settings.dur+' s · '+S.cap.samples.length+' readings'+(best!=null?' · best ±'+best.toFixed(1)+' m':' · waiting for GPS')+(S.cap.moved?' · '+S.cap.moved+' skipped (phone moved)':'')+(isMoving()?' · HOLD STILL':'')}
    if(f>=1)finishCapture();
  }
  if(S.walk){var t2=$('#walktxt');if(t2)t2.textContent=S.walk.pts.length+' points · '+Math.round(S.walk.len)+' m walked'+(S.gps.acc!=null?' · GPS ±'+S.gps.acc.toFixed(1)+' m':'')}
}
setInterval(function(){updateChip();updateLive()},250);

// ---------- drawing ----------
function svgPoly(an){
  var P=an.P,W=320,H=250,pad=30,minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  P.forEach(function(p){minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y)});
  var w=maxx-minx||1,h=maxy-miny||1,sc=Math.min((W-2*pad)/w,(H-2*pad)/h),ox=(W-w*sc)/2-minx*sc,oy=(H-h*sc)/2-miny*sc;
  var Q=P.map(function(p){return{x:p.x*sc+ox,y:H-(p.y*sc+oy)}});
  var pts=Q.map(function(q){return q.x.toFixed(1)+','+q.y.toFixed(1)}).join(' ');
  var s='<svg class="plot" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Plot shape">';
  s+='<polygon points="'+pts+'" fill="var(--fill)" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>';
  var few=P.length<=12;
  Q.forEach(function(q,i){
    if(few){
      var nq=Q[(i+1)%Q.length],mx=(q.x+nq.x)/2,my=(q.y+nq.y)/2;
      s+='<text x="'+mx.toFixed(1)+'" y="'+(my-4).toFixed(1)+'" text-anchor="middle" font-size="11" style="fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px">'+an.sides[i].toFixed(1)+' m</text>';
      s+='<circle cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="9" fill="var(--acc)"/><text x="'+q.x.toFixed(1)+'" y="'+(q.y+4).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">'+(i+1)+'</text>';
    }else s+='<circle cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="2.5" fill="var(--acc)"/>';
  });
  s+='<text x="'+(W-14)+'" y="22" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--mut)">N</text><path d="M'+(W-14)+' 26 l0 14 M'+(W-14)+' 26 l-4 5 M'+(W-14)+' 26 l4 5" stroke="var(--mut)" stroke-width="1.5" fill="none"/>';
  return s+'</svg>';
}

function resultHTML(an,mode,withSave){
  var q=quality(an.rel),u=S.settings.unit,o=['cent','acre','sqm','sqft'].filter(function(x){return x!==u}),k=haAre(an.area);
  var h='<div class="mut small">Map area (horizontal)</div><div class="big-num">'+fa(an.area,u)+' <small>'+UNIT[u].l+'</small></div>';
  h+='<div style="margin:6px 0"><span class="tag '+q.c+'">'+q.t+'</span> <span class="mut small">typical error ±'+num(UNIT[u].f(an.sig),u==='cent'?2:u==='acre'?4:u==='sqm'?1:0)+' '+UNIT[u].l+' ('+(an.rel*100).toFixed(1)+'%)</span></div>';
  h+='<div class="mut small">'+esc(q.d.charAt(0).toUpperCase()+q.d.slice(1))+'. Estimate from the GPS accuracy reported by the phone.</div>';
  if(an.cross)h+='<div class="warnbox">Boundary lines cross each other. Corners must be taken in order around the plot. Tap a corner to retake it.</div>';
  h+='<table>'+o.map(function(x){return'<tr><td>'+UNIT[x].l+'</td><td>'+fa(an.area,x)+'</td></tr>'}).join('');
  h+='<tr><td>Hectare · Are · sq m</td><td>'+k.ha+' Ha '+k.are+' Ar '+k.m2.toFixed(1)+' m²</td></tr>';
  h+='<tr><td>Perimeter</td><td>'+num(an.per,1)+' m</td></tr>'+slopeRows(an,u)+'</table>';
  h+='<div class="mut small" style="margin-top:8px">The slope is worked out from the phone’s GPS height at your corners. It is rough, and only slopes steeper than a few degrees show up.</div>';
  h+=svgPoly(an);
  return h;
}
function slopeRows(an,u){
  var s=an.slope,row=function(a,b){return'<tr><td>'+a+'</td><td>'+b+'</td></tr>'};
  if(!s||!s.ok)return row('Slope','no height from phone');
  if(!s.detectable)return row('Slope','none detected (under ~'+Math.max(1,Math.round(s.limitDeg))+'°)');
  return row('Slope (estimated)','≈'+s.slopeDeg.toFixed(0)+'° ±'+Math.max(1,Math.round(s.noiseDeg))+'°, downhill '+compass8(s.aspect))+row('Area along the slope',fa(an.surface,u)+' '+UNIT[u].l);
}

// ---------- screens ----------
function render(){
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===S.tab)});
  if(S.tab==='measure')renderMeasure();else if(S.tab==='plots')renderPlots();else renderMore();
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){S.tab=b.dataset.tab;S.viewId=null;render()}});

function renderMeasure(){
  if(S.tab!=='measure')return;
  var d=S.draft,n=d.corners.length,an=analyze(d.corners,d.mode),busy=!!(S.cap||S.walk);
  var h='<div class="card"><label>Plot name</label><input id="fName" placeholder="e.g. Home plot" value="'+esc(d.name)+'" autocomplete="off">';
  h+='<label>Place</label><input id="fPlace" placeholder="e.g. Malappuram, Village / survey no." value="'+esc(d.place)+'" autocomplete="off">';
  h+='<div class="seg"><button data-mode="corners" class="'+(d.mode==='corners'?'on':'')+'"'+(busy?' disabled':'')+'>Corner points</button><button data-mode="walk" class="'+(d.mode==='walk'?'on':'')+'"'+(busy?' disabled':'')+'>Walk boundary</button></div></div>';
  h+='<div class="card"><h2>'+(d.mode==='corners'?'Corners':'Walk')+'</h2>';
  if(d.mode==='corners'){
    if(S.cap){
      var idx=S.cap.replace>=0?S.cap.replace+1:n+1;
      h+='<div><b>Capturing corner '+idx+'</b>. Stand still at the corner.</div><div class="bar"><i id="capbar"></i></div><div class="mut small" id="captxt">Starting…</div><div class="row" style="margin-top:12px"><button class="pri" id="bUse">Use now</button><button id="bCancel">Cancel</button></div>';
    }else{
      h+='<button class="pri big" id="bCap">Capture corner '+(n+1)+'</button><div class="mut small" style="margin-top:8px">Stand on the corner mark. Hold the phone steady in front of your chest, above the mark, and do not walk or sway. The phone averages GPS for '+S.settings.dur+' s and skips readings while it is moving. Go around the plot in order.</div>';
      if(n){h+='<div class="corners">'+d.corners.map(function(c,i){return'<button data-c="'+i+'">'+(i+1)+' · ±'+c.acc.toFixed(1)+' m</button>'}).join('')+'</div><div class="row" style="margin-top:12px"><button id="bUndo">Undo last</button><button id="bClear" class="danger">Start over</button></div>'}
    }
  }else{
    if(S.walk){
      h+='<div><b>Walking…</b> Follow the boundary and return to where you started.</div><div class="mut small" id="walktxt" style="margin:8px 0">Waiting for GPS…</div><div class="row"><button class="pri" id="bWalkEnd">Finish</button><button id="bWalkCancel">Cancel</button></div>';
    }else{
      h+='<button class="pri big" id="bWalk">'+(n?'Walk again':'Start walking')+'</button><div class="mut small" style="margin-top:8px">Start at one corner, walk slowly along the boundary, come back to the start, then tap Finish. Good for large plots. Corners get slightly rounded.</div>';
      if(n)h+='<div class="row" style="margin-top:12px"><button id="bClear" class="danger">Start over</button></div>';
    }
  }
  h+='</div>';
  if(an&&!busy){
    h+='<div class="card"><h2>Result</h2>'+resultHTML(an,d.mode,true)+'<label>Notes (optional)</label><input id="fNotes" value="'+esc(d.notes)+'" placeholder="e.g. east side near road, tree cover" autocomplete="off"><button class="pri big" id="bSave" style="margin-top:12px">Save plot</button></div>';
  }else if(!busy){
    h+='<div class="mut small" style="padding:0 4px">Need at least 3 corners to calculate the area.</div>';
  }
  $('#app').innerHTML=h;
  var q=function(s){return $(s)};
  if(q('#fName'))q('#fName').oninput=function(){d.name=this.value;saveDraft()};
  if(q('#fPlace'))q('#fPlace').oninput=function(){d.place=this.value;saveDraft()};
  if(q('#fNotes'))q('#fNotes').oninput=function(){d.notes=this.value;saveDraft()};
  document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){if(busy)return;if(d.mode!==b.dataset.mode&&d.corners.length){choose('Switch mode?','This clears the corners you have so far.',[{label:'Switch',val:true,cls:'pri'},{label:'Keep',val:false}]).then(function(ok){if(ok){d.mode=b.dataset.mode;d.corners=[];saveDraft();renderMeasure()}})}else{d.mode=b.dataset.mode;saveDraft();renderMeasure()}}});
  if(q('#bCap'))q('#bCap').onclick=function(){startCapture()};
  if(q('#bUse'))q('#bUse').onclick=finishCapture;
  if(q('#bCancel'))q('#bCancel').onclick=cancelCapture;
  if(q('#bUndo'))q('#bUndo').onclick=function(){d.corners.pop();saveDraft();renderMeasure()};
  if(q('#bClear'))q('#bClear').onclick=function(){choose('Start over?','All corners of this plot will be removed.',[{label:'Remove all',val:true,cls:'danger'},{label:'Keep',val:false}]).then(function(ok){if(ok){d.corners=[];saveDraft();renderMeasure()}})};
  document.querySelectorAll('.corners button').forEach(function(b){b.onclick=function(){var i=+b.dataset.c;choose('Corner '+(i+1),'Accuracy ±'+d.corners[i].acc.toFixed(1)+' m from '+d.corners[i].n+' readings.',[{label:'Retake',val:'r',cls:'pri'},{label:'Delete',val:'d',cls:'danger'},{label:'Cancel',val:'c'}]).then(function(v){if(v==='r')startCapture(i);else if(v==='d'){d.corners.splice(i,1);saveDraft();renderMeasure()}})}});
  if(q('#bWalk'))q('#bWalk').onclick=startWalk;
  if(q('#bWalkEnd'))q('#bWalkEnd').onclick=finishWalk;
  if(q('#bWalkCancel'))q('#bWalkCancel').onclick=cancelWalk;
  if(q('#bSave'))q('#bSave').onclick=savePlot;
  updateLive();
}

function savePlot(){
  var d=S.draft,an=analyze(d.corners,d.mode);if(!an)return;
  var p={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:d.name.trim()||('Plot '+fdate(Date.now())),place:d.place.trim(),notes:d.notes.trim(),ts:Date.now(),mode:d.mode,corners:d.corners,area:an.area,per:an.per,sig:an.sig};
  S.plots.unshift(p);savePlots();
  S.draft={name:'',place:'',notes:'',mode:d.mode,corners:[]};saveDraft();
  S.tab='plots';S.viewId=p.id;render();toast('Saved');
}

function renderPlots(){
  if(S.viewId){var p=S.plots.filter(function(x){return x.id===S.viewId})[0];if(p)return renderDetail(p);S.viewId=null}
  var f=S.filter.toLowerCase(),list=S.plots.filter(function(p){return!f||(p.name+' '+p.place).toLowerCase().indexOf(f)>=0});
  var h='<div class="card"><input id="fSearch" placeholder="Search by name or place" value="'+esc(S.filter)+'" autocomplete="off"></div>';
  if(!S.plots.length)h+='<div class="mut" style="padding:20px 8px;text-align:center">No saved plots yet. Measure one on the first tab.</div>';
  list.forEach(function(p){
    h+='<button class="plotitem" data-id="'+p.id+'"><b>'+esc(p.name)+'</b><div class="mut small">'+esc(p.place||'No place')+' · '+fdate(p.ts)+'</div><div style="margin-top:6px;font-weight:700">'+fa(p.area,S.settings.unit)+' '+UNIT[S.settings.unit].l+' <span class="mut small" style="font-weight:400">('+fa(p.area,S.settings.unit==='acre'?'cent':'acre')+' '+UNIT[S.settings.unit==='acre'?'cent':'acre'].l+')</span></div></button>';
  });
  $('#app').innerHTML=h;
  var s=$('#fSearch');if(s)s.oninput=function(){S.filter=this.value;var pos=this.selectionStart;renderPlots();var n=$('#fSearch');n.focus();n.setSelectionRange(pos,pos)};
  document.querySelectorAll('.plotitem').forEach(function(b){b.onclick=function(){S.viewId=b.dataset.id;renderPlots();window.scrollTo(0,0)}});
}

function summary(p,an){
  var k=haAre(an.area),t=p.name+(p.place?' ('+p.place+')':'')+'\nDate: '+fdate(p.ts)+'\n';
  t+='Area: '+fa(an.area,'cent')+' cent = '+fa(an.area,'acre')+' acre = '+fa(an.area,'sqm')+' sq m = '+fa(an.area,'sqft')+' sq ft\n';
  t+='Kerala style: '+k.ha+' Ha '+k.are+' Ar '+k.m2.toFixed(1)+' m2\nPerimeter: '+an.per.toFixed(1)+' m\nEstimated error: +/-'+an.sig.toFixed(1)+' sq m ('+(an.rel*100).toFixed(1)+'%) phone GPS\n';
  if(an.slope&&an.slope.ok)t+=an.slope.detectable?('Slope: about '+an.slope.slopeDeg.toFixed(0)+' deg, downhill '+compass8(an.slope.aspect)+'; area along the slope '+fa(an.surface,'cent')+' cent\n'):('Slope: none detected (under ~'+Math.round(an.slope.limitDeg)+' deg)\n');
  if(p.notes)t+='Notes: '+p.notes+'\n';
  t+='Corners (lat, lon, accuracy):\n'+p.corners.map(function(c,i){return(i+1)+': '+c.lat.toFixed(7)+', '+c.lon.toFixed(7)+' (+/-'+c.acc.toFixed(1)+' m)'}).join('\n');
  return t;
}
function geojson(plots){
  return JSON.stringify({type:'FeatureCollection',features:plots.map(function(p){var ring=p.corners.map(function(c){return[+c.lon.toFixed(8),+c.lat.toFixed(8)]});ring.push(ring[0]);return{type:'Feature',properties:{name:p.name,place:p.place,notes:p.notes,area_sqm:+p.area.toFixed(2),area_cent:+UNIT.cent.f(p.area).toFixed(3),perimeter_m:+p.per.toFixed(2),date:new Date(p.ts).toISOString()},geometry:{type:'Polygon',coordinates:[ring]}}})},null,1);
}
function renderDetail(p){
  var an=analyze(p.corners,p.mode||'corners');
  var h='<button id="bBack" style="margin-bottom:10px">&larr; All plots</button><div class="card"><div style="font-size:20px;font-weight:700">'+esc(p.name)+'</div><div class="mut small">'+esc(p.place||'No place')+' · '+fdate(p.ts)+'</div>'+(p.notes?'<div class="small" style="margin-top:6px">'+esc(p.notes)+'</div>':'')+'<div style="margin-top:10px">'+resultHTML(an,p.mode,false)+'</div></div>';
  h+='<div class="card"><h2>Corners</h2><table>'+p.corners.map(function(c,i){return'<tr><td>'+(i+1)+'</td><td style="font-weight:400;font-size:13px">'+c.lat.toFixed(6)+', '+c.lon.toFixed(6)+' · ±'+c.acc.toFixed(1)+' m</td></tr>'}).join('')+'</table></div>';
  h+='<div class="row"><button class="pri" id="bShare">Share summary</button><button id="bGeo">GeoJSON</button></div><div class="row" style="margin-top:8px"><button id="bRename">Rename</button><button id="bDel" class="danger">Delete</button></div>';
  $('#app').innerHTML=h;
  $('#bBack').onclick=function(){S.viewId=null;renderPlots()};
  $('#bShare').onclick=function(){share(p.name,summary(p,an))};
  $('#bGeo').onclick=function(){share(p.name+' GeoJSON',geojson([p]),(p.name.replace(/[^\w\-]+/g,'_')||'plot')+'.geojson','application/geo+json')};
  $('#bDel').onclick=function(){choose('Delete this plot?',esc(p.name)+' will be removed from this phone.',[{label:'Delete',val:true,cls:'danger'},{label:'Cancel',val:false}]).then(function(ok){if(ok){S.plots=S.plots.filter(function(x){return x.id!==p.id});savePlots();S.viewId=null;renderPlots()}})};
  $('#bRename').onclick=function(){
    sheet('<h3>Rename</h3><label>Name</label><input id="rN" value="'+esc(p.name)+'"><label>Place</label><input id="rP" value="'+esc(p.place)+'"><div class="row"><button class="pri" id="rOk">Save</button><button id="rNo">Cancel</button></div>');
    $('#rNo').onclick=closeSheet;$('#rOk').onclick=function(){p.name=$('#rN').value.trim()||p.name;p.place=$('#rP').value.trim();savePlots();closeSheet();renderPlots()};
  };
}

function renderMore(){
  var st=S.settings;
  var opt=function(vals,cur,lab){return vals.map(function(v){return'<option value="'+v+'"'+(String(cur)===String(v)?' selected':'')+'>'+(lab?lab(v):v)+'</option>'}).join('')};
  var h='<div class="card"><h2>Settings</h2><label>Averaging time per corner</label><select id="sDur">'+opt([15,30,45,60,90],st.dur,function(v){return v+' seconds'})+'</select>';
  h+='<label>Ignore GPS readings worse than</label><select id="sAcc">'+opt([8,12,20,30,50],st.maxAcc,function(v){return'±'+v+' m'})+'</select>';
  h+='<label>Main area unit</label><select id="sUnit"><option value="cent"'+(st.unit==='cent'?' selected':'')+'>cent</option><option value="acre"'+(st.unit==='acre'?' selected':'')+'>acre</option><option value="sqm"'+(st.unit==='sqm'?' selected':'')+'>sq m</option><option value="sqft"'+(st.unit==='sqft'?' selected':'')+'>sq ft</option></select></div>';
  h+='<div class="card"><h2>Backup</h2><div class="mut small">Saved plots live only on this phone, inside this app. Take a backup now and then.</div><div class="row" style="margin-top:10px"><button id="bExp" class="pri">Export all</button><button id="bImp">Import</button></div><div class="row" style="margin-top:8px"><button id="bGeoAll">All as GeoJSON</button></div><div class="mut small" style="margin-top:8px">'+S.plots.length+' plot'+(S.plots.length===1?'':'s')+' saved</div></div>';
  h+='<div class="card"><h2>How accurate is this?</h2><div class="small">Phone GPS alone is usually off by about 1 to 5 m in the open, and worse under trees or next to buildings. The error in the area depends on plot size:</div><ul class="tips small"><li><b>Acres:</b> usually around 1% or better. Fine for estimates.</li><li><b>10 to 50 cent:</b> a few percent. Rough.</li><li><b>1 to 10 cent:</b> error is too big. Use tape or a laser distance meter.</li></ul><div class="small" style="margin-top:8px">This is not centimetre accuracy and not a legal survey. For that you need an RTK GNSS receiver or a licensed surveyor.</div><div class="small" style="margin-top:8px"><b>Sloping land:</b> the main number is the flat map (horizontal) area. The app also estimates the slope from GPS height. A web app cannot read the iPhone barometer or LiDAR, so small slopes are not detected.</div></div>';
  h+='<div class="card"><h2>Tips for best results</h2><ul class="tips small"><li>Stand in the open, away from trees, walls and vehicles.</li><li>Wait until the GPS chip at the top shows green or amber before you capture.</li><li>Take all corners in one session, within about 15 minutes. Common GPS errors then cancel out in the area.</li><li>Take corners in order around the plot (clockwise or anticlockwise).</li><li>Keep the phone steady and the screen on. The app asks the phone to stay awake.</li><li>Measure again on another day or time of day and compare. If the two areas differ, trust neither fully.</li></ul></div>';
  h+='<div class="card"><h2>Install on iPhone</h2><ul class="tips small"><li>Open this page in Safari, tap Share, then <b>Add to Home Screen</b>.</li><li>Always open it from the home screen icon. Data saved in a Safari tab is not shared with the icon.</li><li>Allow Location when asked. In iPhone Settings, keep <b>Precise Location</b> ON for this app.</li></ul></div>';
  $('#app').innerHTML=h;
  $('#sDur').onchange=function(){st.dur=+this.value;saveSettings()};
  $('#sAcc').onchange=function(){st.maxAcc=+this.value;saveSettings()};
  $('#sUnit').onchange=function(){st.unit=this.value;saveSettings()};
  $('#bExp').onclick=function(){share('Land Measure backup',JSON.stringify({app:'land-measure',v:1,exported:Date.now(),plots:S.plots},null,1),'land-measure-backup.json','application/json')};
  $('#bGeoAll').onclick=function(){if(!S.plots.length){toast('No plots yet');return}share('Land plots GeoJSON',geojson(S.plots),'land-plots.geojson','application/geo+json')};
  $('#bImp').onclick=function(){
    sheet('<h3>Import backup</h3><div class="mut small">Pick the backup .json file, or paste its text below.</div><input type="file" id="iFile" accept=".json,application/json" style="margin-top:10px"><textarea id="iTxt" placeholder="Paste backup text here" style="margin-top:10px"></textarea><div class="row"><button class="pri" id="iOk">Import</button><button id="iNo">Cancel</button></div>');
    $('#iNo').onclick=closeSheet;
    $('#iFile').onchange=function(){var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('#iTxt').value=r.result};r.readAsText(f)};
    $('#iOk').onclick=function(){
      try{var j=JSON.parse($('#iTxt').value),arr=Array.isArray(j)?j:j.plots;if(!Array.isArray(arr))throw 0;
        var have={};S.plots.forEach(function(p){have[p.id]=1});var add=0;
        arr.forEach(function(p){if(p&&p.id&&Array.isArray(p.corners)&&p.corners.length>=3&&!have[p.id]){S.plots.push(p);add++}});
        S.plots.sort(function(a,b){return b.ts-a.ts});savePlots();closeSheet();toast('Imported '+add+' plot'+(add===1?'':'s'));renderMore();
      }catch(e){toast('That is not a valid backup')}
    };
  };
}

render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
// auto-start GPS if the user has used the app before (permission already granted)
try{if(navigator.permissions&&navigator.permissions.query){navigator.permissions.query({name:'geolocation'}).then(function(r){if(r.state==='granted')startGPS()}).catch(function(){})}}catch(e){}
})();
</script>
</body>
</html>
