<title>Land Measure</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#16211a;--mut:#5d6b61;--line:#dfe5df;--acc:#1f7a4d;--accInk:#fff;--warn:#b7791f;--bad:#c0392b;--good:#1f7a4d;--soft:#e8f2ec;--fill:rgba(31,122,77,.16)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1511;--card:#18211b;--ink:#e8efe9;--mut:#9fb0a4;--line:#2a372e;--acc:#3fb37a;--accInk:#06150d;--warn:#e0a84a;--bad:#ef6b5b;--good:#3fb37a;--soft:#1e2c23;--fill:rgba(63,179,122,.2)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
header .ttl{font-weight:700;font-size:19px}
main{padding:12px 14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:15px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:90px;resize:vertical}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--soft);color:var(--ink);font-weight:600;cursor:pointer}
button.pri{background:var(--acc);color:var(--accInk)}
button.big{width:100%;padding:18px 16px;font-size:18px}
button.danger{color:var(--bad)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.chip{border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;background:var(--soft);color:var(--ink)}
.chip.good{background:var(--good);color:var(--accInk)}.chip.warn{background:var(--warn);color:#fff}.chip.bad{background:var(--bad);color:#fff}.chip.off{background:var(--line);color:var(--mut)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;background:transparent;padding:9px}.seg button.on{background:var(--acc);color:var(--accInk)}
.corners{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.corners button{padding:7px 11px;font-size:14px;border-radius:999px}
.mut{color:var(--mut);font-size:14px}
.small{font-size:13px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.big-num{font-size:34px;font-weight:800;letter-spacing:-.02em}
.big-num small{font-size:16px;font-weight:600;color:var(--mut)}
table{width:100%;border-collapse:collapse;margin-top:8px}
td{padding:6px 0;border-top:1px solid var(--line);font-size:15px}td:last-child{text-align:right;font-weight:600}
.tag{display:inline-block;border-radius:8px;padding:3px 9px;font-size:13px;font-weight:700;color:#fff}
.tag.good{background:var(--good)}.tag.warn{background:var(--warn)}.tag.bad{background:var(--bad)}
.warnbox{background:rgba(192,57,43,.12);border:1px solid var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
svg.plot{width:100%;height:auto;display:block;background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-top:10px}
.plotitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);margin-bottom:10px;padding:13px 14px;border-radius:14px;font-weight:400}
.plotitem b{font-size:17px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:transparent;border-radius:10px;padding:9px 4px;font-size:13px;color:var(--mut)}
nav button b{display:block;font-size:20px;line-height:1.1}
nav button.on{color:var(--acc)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.on{display:flex}
#sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
#sheet h3{margin:0 0 6px}
#sheet .row{margin-top:12px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#222;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;z-index:30;display:none;max-width:90%;text-align:center}
ul.tips{margin:6px 0 0;padding-left:20px}ul.tips li{margin:6px 0}
body.maptab{overflow:hidden;overscroll-behavior:none}
body.maptab main{padding:0;max-width:none}
#mapwrap{position:fixed;left:0;right:0;z-index:2;overflow:hidden;background:#26302a;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#mapc{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#mpanel{position:absolute;top:8px;left:8px;right:60px;background:rgba(12,18,14,.78);color:#fff;border-radius:14px;padding:8px 12px;pointer-events:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#mpanel .a{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
#mpanel .a small{font-size:12.5px;font-weight:500;opacity:.82;letter-spacing:0;margin-left:7px}
#mpanel .b{font-size:13px;opacity:.93;margin-top:2px}
#mpanel .c{font-size:12.5px;margin-top:3px;color:#ffd23f}
#mctl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:8px;z-index:2}
.mc{width:44px;height:44px;padding:0;border-radius:22px;background:#fff;color:#16211a;font-size:20px;line-height:1;box-shadow:0 1px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
#mbot{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
#minfo{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;color:#fff;font-size:10.5px;line-height:1.25;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none}
#msc{flex:0 0 auto}#msc i{display:block;height:6px;border:2px solid #fff;border-top:none;box-shadow:0 0 2px #000}#msc span{display:block;font-size:11px;font-weight:700}
#mattr{text-align:right;max-width:62%;opacity:.95}
.mtb{display:flex;gap:8px}
.mtb button{flex:1;background:#fff;color:#16211a;box-shadow:0 1px 6px rgba(0,0,0,.45);padding:13px 4px;font-size:14px;white-space:nowrap}
body.maptab #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
.mtb button.pri{background:#1f7a4d;color:#fff}
.mcard{background:rgba(255,255,255,.96);color:#16211a;border-radius:14px;padding:12px;box-shadow:0 1px 8px rgba(0,0,0,.45)}
.mcard .mut{color:#4a5a4f}.mcard .bar{background:#dfe5df}.mcard .bar>i{background:#1f7a4d}
.mcard button{background:#e8f2ec;color:#16211a}.mcard button.pri{background:#1f7a4d;color:#fff}
#mpop{position:absolute;top:8px;right:60px;width:min(300px,calc(100% - 72px));max-height:calc(100% - 16px);overflow:auto;background:#fff;color:#16211a;border-radius:14px;padding:12px;box-shadow:0 4px 18px rgba(0,0,0,.5);display:none;z-index:3}
#mpop.on{display:block}
#mpop .pt{font-size:13px;color:#4a5a4f;margin:10px 0 4px;display:flex;justify-content:space-between}
#mpop .pt:first-child{margin-top:0}
#mpop input[type=text]{background:#f4f6f3;color:#16211a;border:1px solid #dfe5df}
#mpop input[type=range]{padding:0;border:0;background:transparent;accent-color:#1f7a4d}
#mpop label.ck{display:flex;align-items:center;gap:10px;color:#16211a;font-size:15px;margin:8px 0 0}
#mpop label.ck input{width:20px;height:20px;padding:0;flex:0 0 auto;accent-color:#1f7a4d}
#mpop button{background:#e8f2ec;color:#16211a;padding:10px 12px}
#mpop button.on{background:#1f7a4d;color:#fff}
#mpop button.danger{color:#c0392b;width:100%;margin-top:12px}
#mpop .seg2{display:flex;gap:6px}#mpop .seg2 button{flex:1}
#mpop .res{display:block;width:100%;text-align:left;font-weight:500;font-size:14px;margin-top:6px}
#mpop .small{font-size:12px;color:#4a5a4f;margin-top:8px}
.recbox{border-radius:10px;padding:9px 12px;font-size:14px;margin-top:10px;background:var(--soft);border:1px solid var(--line)}
.recbox.off{background:rgba(183,121,31,.14);border-color:var(--warn)}
.tools button{display:block;width:100%;text-align:left;margin-top:8px;font-weight:600}
.tools button small{display:block;font-weight:400;color:var(--mut);font-size:13px;margin-top:2px}
.ideas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.idea{display:block;text-align:left;background:var(--bg);border:1px solid var(--line);padding:8px;border-radius:12px;font-weight:400}
.idea b{display:block;font-size:14px;margin-top:4px}.idea span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.idea svg{width:100%;height:auto;display:block;border-radius:8px;background:var(--card)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs div{position:relative;width:76px;height:76px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumbs i{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:11px;background:var(--bad);color:#fff;font-style:normal;font-size:14px;line-height:22px;text-align:center}
#mpop .tiny,.mcard .tiny{font-size:12px;color:#4a5a4f}
.mcard .stp{display:flex;align-items:center;gap:8px;margin-top:8px}
.mcard .stp b{flex:1;text-align:center;font-size:14px}
.mcard .stp button{flex:0 0 46px;padding:8px 0}
.mcard .row button{white-space:nowrap;padding:12px 6px}
.mcard .seg2{display:flex;gap:5px;margin-top:8px}.mcard .seg2 button{flex:1;padding:9px 2px;font-size:13px}
.mcard button.on{background:#1f7a4d;color:#fff}
.mcard input[type=text]{background:#f4f6f3;color:#16211a;border:1px solid #dfe5df;margin-top:8px;padding:9px 10px}
#spc{max-height:46vh;overflow:auto}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
</style>

<body>
<header><div class="ttl">Land Measure</div><button id="gpsChip" class="chip off">GPS off</button></header>
<main id="app"></main>
<nav>
  <button data-tab="measure"><b>&#128205;</b>Measure</button>
  <button data-tab="map"><b>&#128752;&#65039;</b>Map</button>
  <button data-tab="plots"><b>&#128209;</b>Plots</button>
  <button data-tab="more"><b>&#9881;&#65039;</b>More</button>
</nav>

<script>
// <MATH>
var A_=6378137,E2=0.00669437999014,DEG=Math.PI/180;
function radii(latDeg){var s=Math.sin(latDeg*DEG),w=1-E2*s*s,N=A_/Math.sqrt(w),M=A_*(1-E2)/(w*Math.sqrt(w));return{N:N,M:M}}
function toXY(pts,lat0,lon0){var r=radii(lat0),c=Math.cos(lat0*DEG);return pts.map(function(p){return{x:(p.lon-lon0)*DEG*r.N*c,y:(p.lat-lat0)*DEG*r.M}})}
function fromXY(x,y,lat0,lon0){var r=radii(lat0),c=Math.cos(lat0*DEG);return{lat:lat0+y/r.M/DEG,lon:lon0+x/(r.N*c)/DEG}}
function dist(a,b){var r=radii(a.lat);return Math.hypot((b.lon-a.lon)*DEG*r.N*Math.cos(a.lat*DEG),(b.lat-a.lat)*DEG*r.M)}
function shoelace(P){var s=0;for(var i=0;i<P.length;i++){var a=P[i],b=P[(i+1)%P.length];s+=a.x*b.y-b.x*a.y}return Math.abs(s)/2}
function orient(a,b,c){return(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x)}
function segInt(p1,p2,p3,p4){var d1=orient(p3,p4,p1),d2=orient(p3,p4,p2),d3=orient(p1,p2,p3),d4=orient(p1,p2,p4);return((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0))}
function selfCross(P){var n=P.length;if(n<4)return false;for(var i=0;i<n;i++){for(var j=i+1;j<n;j++){if(j===i+1||(i===0&&j===n-1))continue;if(segInt(P[i],P[(i+1)%n],P[j],P[(j+1)%n]))return true}}return false}
// Fit a plane z = a*x + b*y + c through corner altitudes (weighted by altitude accuracy).
// Returns slope in degrees (noise-corrected), whether it is detectable above the GPS height noise,
// the surface-area factor sqrt(1+g^2) and the downhill compass bearing.
function slopeFit(C,P){
  var pts=[];
  for(var i=0;i<C.length;i++){var z=C[i].alt;if(typeof z==='number'&&isFinite(z)){var s=C[i].altAcc;pts.push({x:P[i].x,y:P[i].y,z:z,s:Math.max(s>0?s:5,1)})}}
  if(pts.length<3)return{ok:false,why:'no-alt'};
  var sw=0,mx=0,my=0,mz=0;
  pts.forEach(function(p){p.w=1/(p.s*p.s);sw+=p.w;mx+=p.w*p.x;my+=p.w*p.y;mz+=p.w*p.z});
  mx/=sw;my/=sw;mz/=sw;
  var sxx=0,sxy=0,syy=0,sxz=0,syz=0;
  pts.forEach(function(p){var dx=p.x-mx,dy=p.y-my,dz=p.z-mz;sxx+=p.w*dx*dx;sxy+=p.w*dx*dy;syy+=p.w*dy*dy;sxz+=p.w*dx*dz;syz+=p.w*dy*dz});
  var det=sxx*syy-sxy*sxy;
  if(!(sxx>0&&syy>0)||det<1e-6*sxx*syy)return{ok:false,why:'shape'};
  var a=(sxz*syy-syz*sxy)/det,b=(syz*sxx-sxz*sxy)/det,va=syy/det,vb=sxx/det;
  var g2=a*a+b*b,n2=va+vb,g2d=Math.max(0,g2-n2),det2=g2>4*n2;
  return{ok:true,detectable:det2,slopeDeg:Math.atan(Math.sqrt(g2d))/DEG,noiseDeg:Math.atan(Math.sqrt(n2))/DEG,limitDeg:Math.atan(2*Math.sqrt(n2))/DEG,factor:det2?Math.sqrt(1+g2d):1,aspect:((Math.atan2(-a,-b)/DEG)+360)%360};
}
function compass8(deg){return['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8]}
// independent-error variance of the area from the corners of a polygon (each corner moves along the normal of its two neighbours)
function cvar(P,C,only){var n=P.length,v=0;for(var k=0;k<n;k++){if(only&&!only(C[k]))continue;var p=P[(k+n-1)%n],q=P[(k+1)%n],g2=((q.x-p.x)*(q.x-p.x)+(q.y-p.y)*(q.y-p.y))/4,sa=(C[k].acc||3)/1.5;v+=sa*sa*g2}return v}
// corners: [{lat,lon,acc,alt,altAcc,src}]; mode 'corners' (independent errors per corner) or 'walk' (correlated along the path)
// holes: optional array of corner arrays (house, pond ...) that are taken out of the area
function analyze(C,mode,holes){
  if(!C||C.length<3)return null;
  var lat0=0,lon0=0;C.forEach(function(c){lat0+=c.lat;lon0+=c.lon});lat0/=C.length;lon0/=C.length;
  var P=toXY(C,lat0,lon0),area=shoelace(P),per=0,sides=[],n=P.length;
  for(var i=0;i<n;i++){var a=P[i],b=P[(i+1)%n],L=Math.hypot(b.x-a.x,b.y-a.y);sides.push(L);per+=L}
  // GPS points in walk mode share one correlated error; points placed on the map / tape / cut points always have independent errors
  var isInd=function(c){return c.src==='map'||c.src==='tape'||c.src==='cut'},nmap=C.filter(function(c){return c.src==='map'}).length,walkSig=0,v;
  v=cvar(P,C,mode==='walk'?isInd:null);
  if(mode==='walk'){var accs=C.filter(function(c){return!isInd(c)}).map(function(c){return c.acc||3}).sort(function(a,b){return a-b});if(accs.length){var med=accs[Math.floor(accs.length/2)];walkSig=(med/1.5)*Math.sqrt(2*10*per)}}
  var sig=Math.sqrt(walkSig*walkSig+v);
  var hA=0,hv=0,H=[];
  (holes||[]).forEach(function(h){if(h&&h.length>=3){var Q=toXY(h,lat0,lon0);H.push(Q);hA+=shoelace(Q);hv+=cvar(Q,h)}});
  var net=Math.max(0,area-hA),sigN=Math.sqrt(sig*sig+hv);
  var slope=slopeFit(C,P);

function shrink(file,max){
  return new Promise(function(res,rej){
    var done=function(w,h,src){var k=Math.min(1,max/Math.max(w,h)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);cv.toBlob(function(b){b?res(b):rej(new Error('no blob'))},'image/jpeg',0.8)};
    var viaImg=function(){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){done(im.naturalWidth,im.naturalHeight,im);URL.revokeObjectURL(u)};im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('bad image'))};im.src=u};

// ---------- GPS ----------
function startGPS(){
  if(!('geolocation' in navigator)){toast('This browser has no GPS support');return}
  if(S.gps.watching)return;
  S.gps.err=null;S.gps.watching=true;
  S.gps.id=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  updateChip();
}
function stopGPS(){if(S.gps.id!=null)navigator.geolocation.clearWatch(S.gps.id);S.gps.id=null;S.gps.watching=false;S.gps.acc=null;updateChip()}
function onPos(p){
  var c=p.coords,g=S.gps;g.err=null;g.lat=c.latitude;g.lon=c.longitude;g.acc=c.accuracy;g.rx=Date.now();
  var smp={lat:c.latitude,lon:c.longitude,acc:c.accuracy,ts:p.timestamp,
    alt:(typeof c.altitude==='number'&&isFinite(c.altitude))?c.altitude:null,
    altAcc:(typeof c.altitudeAccuracy==='number'&&isFinite(c.altitudeAccuracy))?c.altitudeAccuracy:null};
  if(S.cap&&c.accuracy<=S.settings.maxAcc&&p.timestamp!==S.cap.lastTs){
    S.cap.lastTs=p.timestamp;
    if(isMoving())S.cap.moved++;else S.cap.samples.push(smp);
  }
  if(S.walk&&c.accuracy<=S.settings.maxAcc&&p.timestamp!==S.walk.lastTs){
    S.walk.lastTs=p.timestamp;var w=S.walk,last=w.pts[w.pts.length-1];
    if(!last){w.pts.push(smp)}else{var d=dist(last,smp);if(d>=1.0){w.pts.push(smp);w.len+=d}}
  }
  updateChip();updateLive();
  if(S.tab==='map'){if(M.follow){M.follow=false;locate()}else scheduleDraw()}
}
function onErr(e){
  var g=S.gps;g.err=e.code;
  if(e.code===1){stopGPS();g.err=1;updateChip();sheet('<h3>Location is blocked</h3><div class="mut">On iPhone: Settings &rarr; Privacy &amp; Security &rarr; Location Services &rarr; Safari Websites (or this app) &rarr; <b>While Using</b>, and keep <b>Precise Location</b> ON. Then reopen this app and tap the GPS button.</div><div class="row"><button class="pri" onclick="document.getElementById(\'ov\').classList.remove(\'on\')">OK</button></div>')}
  else updateChip();
}
function gpsState(){
  var g=S.gps;
  if(!g.watching)return{t:'GPS off · tap',c:'off'};
  if(g.err===2)return{t:'GPS unavailable',c:'bad'};
  if(g.acc==null||Date.now()-g.rx>10000)return{t:'Searching…',c:'warn'};
  return{t:'±'+g.acc.toFixed(1)+' m',c:g.acc<=3?'good':g.acc<=8?'warn':'bad'};
}
function updateChip(){var el=$('#gpsChip'),s=gpsState();el.className='chip '+s.c;el.textContent=s.t}
$('#gpsChip').onclick=function(){if(S.gps.watching){toast(S.gps.acc!=null?'GPS is on, accuracy ±'+S.gps.acc.toFixed(1)+' m':'Searching for GPS signal…')}else startGPS()};

// ---------- motion sensor (is the phone held still?) ----------
function startMotion(){
  var M=S.motion;if(M.on||M.asked||typeof DeviceMotionEvent==='undefined')return;
  var attach=function(){window.addEventListener('devicemotion',onMotion);M.on=true};
  try{
    if(typeof DeviceMotionEvent.requestPermission==='function'){M.asked=true;DeviceMotionEvent.requestPermission().then(function(r){if(r==='granted')attach();else M.asked=false}).catch(function(){M.asked=false})}
    else attach();
  }catch(e){}
}
function onMotion(e){var a=e.acceleration;if(!a||a.x==null)return;var m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);if(m>1.0)S.motion.big=Date.now()}
function isMoving(){return S.motion.on&&Date.now()-S.motion.big<1000}

// ---------- wake lock ----------
function wakeOn(){try{if('wakeLock' in navigator&&!S.wake){navigator.wakeLock.request('screen').then(function(l){S.wake=l;l.addEventListener('release',function(){S.wake=null})}).catch(function(){})}}catch(e){}}
function wakeOff(){try{if(S.wake)S.wake.release()}catch(e){}S.wake=null}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&(S.cap||S.walk))wakeOn()});

// ---------- capture ----------
function startCapture(replaceIdx){
  startMotion();startGPS();
  S.cap={samples:[],moved:0,t0:Date.now(),dur:S.settings.dur*1000,lastTs:0,replace:(typeof replaceIdx==='number')?replaceIdx:-1};
  wakeOn();refresh();
}
function finishCapture(){
  var c=S.cap;if(!c)return;S.cap=null;wakeOff();
  if(!c.samples.length){toast(c.moved?'The phone kept moving. Hold it still and try again':'No usable GPS readings. Move to open sky and try again');refresh();return}
  var corner=averageSamples(c.samples);
  if(c.replace>=0&&c.replace<S.draft.corners.length){var old=S.draft.corners[c.replace];if(old.note)corner.note=old.note;if(old.ph)corner.ph=old.ph;S.draft.corners[c.replace]=corner}else S.draft.corners.push(corner);
  saveDraft();refresh();
}
function cancelCapture(){S.cap=null;wakeOff();refresh()}
function startWalk(){startGPS();S.walk={pts:[],len:0,t0:Date.now(),lastTs:0};wakeOn();refresh()}
function finishWalk(){
  var w=S.walk;S.walk=null;wakeOff();
  var out=processWalk(w.pts);
  if(!out){toast('Not enough points. Walk the full boundary, then finish');refresh();return}
  S.draft.corners=out;saveDraft();refresh();
}
function cancelWalk(){S.walk=null;wakeOff();refresh()}
function refresh(){if(S.tab==='measure')renderMeasure();else if(S.tab==='map'){mapBottom();scheduleDraw()}}

function updateLive(){
  if(S.cap){
    var el=(Date.now()-S.cap.t0),f=Math.min(1,el/S.cap.dur),b=$('#capbar'),t=$('#captxt');
    if(b)b.style.width=(f*100)+'%';
    if(t){var best=S.cap.samples.length?Math.min.apply(null,S.cap.samples.map(function(s){return s.acc})):null;
      t.textContent=Math.min(S.settings.dur,Math.floor(el/1000))+' / '+S.settings.dur+' s · '+S.cap.samples.length+' readings'+(best!=null?' · best ±'+best.toFixed(1)+' m':' · waiting for GPS')+(S.cap.moved?' · '+S.cap.moved+' skipped (phone moved)':'')+(isMoving()?' · HOLD STILL':'')}
    if(f>=1)finishCapture();
  }
  if(S.walk){var t2=$('#walktxt');if(t2)t2.textContent=S.walk.pts.length+' points · '+Math.round(S.walk.len)+' m walked'+(S.gps.acc!=null?' · GPS ±'+S.gps.acc.toFixed(1)+' m':'')}
}
setInterval(function(){updateChip();updateLive()},250);

// ---------- drawing ----------
var PALETTE=['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#0aa5a5','#c8b400','#f032e6','#808000','#a05a2c','#008080','#7a7ad8'];
function fitBox(P,W,H,pad){
  var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  P.forEach(function(p){minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y)});
  var w=maxx-minx||1,h=maxy-miny||1,sc=Math.min((W-2*pad)/w,(H-2*pad)/h),ox=(W-w*sc)/2-minx*sc,oy=(H-h*sc)/2-miny*sc;
  return{sc:sc,pt:function(p){return{x:p.x*sc+ox,y:H-(p.y*sc+oy)}}};
}
function ptsStr(Q){return Q.map(function(q){return q.x.toFixed(1)+','+q.y.toFixed(1)}).join(' ')}
function svgPoly(an){
  var P=an.P,W=320,H=250,pad=30,f=fitBox(P,W,H,pad),Q=P.map(f.pt);

  s+='<polygon points="'+ptsStr(Q)+'" fill="var(--fill)" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>';
  (an.H||[]).forEach(function(h){s+='<polygon points="'+ptsStr(h.map(f.pt))+'" fill="rgba(192,57,43,.28)" stroke="var(--bad)" stroke-width="1.8" stroke-dasharray="5 3"/>'});
  var few=P.length<=12;
  Q.forEach(function(q,i){
    if(few){
      var nq=Q[(i+1)%Q.length],mx=(q.x+nq.x)/2,my=(q.y+nq.y)/2;
      s+='<text x="'+mx.toFixed(1)+'" y="'+(my-4).toFixed(1)+'" text-anchor="middle" font-size="11" style="fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px">'+an.sides[i].toFixed(1)+' m</text>';
      s+='<circle cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="9" fill="var(--acc)"/><text x="'+q.x.toFixed(1)+'" y="'+(q.y+4).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">'+(i+1)+'</text>';
    }else s+='<circle cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="2.5" fill="var(--acc)"/>';
  });
  s+='<text x="'+(W-14)+'" y="22" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--mut)">N</text><path d="M'+(W-14)+' 26 l0 14 M'+(W-14)+' 26 l-4 5 M'+(W-14)+' 26 l4 5" stroke="var(--mut)" stroke-width="1.5" fill="none"/>';

function recHTML(an,rec){

function slopeRows(an,u){

var TILE_B='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
var TILE_L='https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}';
var MAXNAT=19,MAXZ=21,MINZ=3,KM='lm.map.v1';
var MS=Object.assign({lat:11.05,lon:76.07,zoom:12,fill:0.12,labels:true,sides:true,saved:true,add:'tap',loupe:true},load(KM,{}));
var M={W:0,H:0,dpr:1,cv:null,cx:null,ptrs:{},g:null,raf:0,sel:-1,view:null,inited:false,refit:false,follow:false,pop:null,sres:[],lastPanel:'',lastScale:'',saveT:null,tileErr:0,ring:-1,split:null,mv:false,loupe:null};
var TC={},TCK=[];

function mX(lon,z){return(lon+180)/360*256*Math.pow(2,z)}
function mY(lat,z){var s=Math.sin(Math.max(-85,Math.min(85,lat))*DEG);return(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256*Math.pow(2,z)}

function fromScr(x,y){var z=MS.zoom;return{lat:mLat(mY(MS.lat,z)+y-M.H/2,z),lon:mLon(mX(MS.lon,z)+x-M.W/2,z)}}
function setAnchor(geo,sx,sy,z){z=Math.max(MINZ,Math.min(MAXZ,z));MS.zoom=z;MS.lat=mLat(mY(geo.lat,z)-(sy-M.H/2),z);MS.lon=mLon(mX(geo.lon,z)-(sx-M.W/2),z)}

// tiles
function peekTile(layer,z,x,y){var n=Math.pow(2,z);x=((x%n)+n)%n;var t=TC[layer+z+'/'+x+'/'+y];return t&&t.ok?t.img:null}
function getTile(layer,z,x,y){
  var n=Math.pow(2,z);x=((x%n)+n)%n;if(y<0||y>=n)return null;
  var key=layer+z+'/'+x+'/'+y,t=TC[key];
  if(t){if(t.ok)return t.img;if(!t.err||Date.now()-t.err<8000)return null;delete TC[key]}
  var img=new Image();t=TC[key]={img:img,ok:false,err:0};
  img.onload=function(){t.ok=true;M.tileErr=0;scheduleDraw()};
  img.onerror=function(){t.err=Date.now();M.tileErr++;scheduleDraw()};
  img.src=(layer==='L'?TILE_L:TILE_B).replace('{z}',z).replace('{x}',x).replace('{y}',y);
  TCK.push(key);if(TCK.length>600){TCK.splice(0,150).forEach(function(k){delete TC[k]})}
  return null;
}
function drawTiles(ctx,layer){
  var z=MS.zoom,tz=Math.min(MAXNAT,Math.max(0,Math.ceil(z-0.25))),ts=256*Math.pow(2,z-tz);
  var ox=mX(MS.lon,z)-M.W/2,oy=mY(MS.lat,z)-M.H/2;
  var x0=Math.floor(ox/ts),x1=Math.floor((ox+M.W)/ts),y0=Math.floor(oy/ts),y1=Math.floor((oy+M.H)/ts),got=0,want=0;
  for(var ty=y0;ty<=y1;ty++)for(var tx=x0;tx<=x1;tx++){
    var dx=Math.floor(tx*ts-ox),dy=Math.floor(ty*ts-oy),w=Math.ceil((tx+1)*ts-ox)-dx,h=Math.ceil((ty+1)*ts-oy)-dy;
    var img=getTile(layer,tz,tx,ty);want++;
    if(img){ctx.drawImage(img,dx,dy,w,h);got++}
    else if(layer==='B'){
      for(var d=1;d<=5&&tz-d>=0;d++){var k=Math.pow(2,d),px=Math.floor(tx/k),py=Math.floor(ty/k),pi=peekTile(layer,tz-d,px,py);
        if(pi){var sw=256/k;ctx.drawImage(pi,(tx-px*k)*sw,(ty-py*k)*sw,sw,sw,dx,dy,w,h);break}}
    }
  }
  return{got:got,want:want};
}

  ctx.save();ctx.translate((a.x+b.x)/2,(a.y+b.y)/2);ctx.rotate(ang);ctx.strokeText(txt,0,dy);ctx.fillText(txt,0,dy);ctx.restore();
}

    ctx.font='700 12px -apple-system,Helvetica,Arial,sans-serif';ctx.textAlign='center';ctx.lineWidth=3.5;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.fillStyle='#fff';
    sp.cutGeo.forEach(function(c){var a=toScr(c.a.lat,c.a.lon),b=toScr(c.b.lat,c.b.lon);

      ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.85)';ctx.fillStyle='#fff';ctx.font='800 17px -apple-system,Helvetica,Arial,sans-serif';ctx.strokeText(t1,q.x,q.y-8);ctx.fillText(t1,q.x,q.y-8);

  }

    if(na>=1){ctx.setLineDash([7,6]);ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.moveTo(AP[na-1].x,AP[na-1].y);ctx.lineTo(pin.x,pin.y);if(na>=2)ctx.lineTo(AP[0].x,AP[0].y);ctx.stroke();ctx.setLineDash([])}
  }

    var ne=n>=3?n:n-1;
    for(var i=0;i<ne;i++){var a=P[i],b=P[(i+1)%n],sl=Math.hypot(b.x-a.x,b.y-a.y);if(sl<56)continue;labelAlong(ctx,a,b,fmtLen(dist(C[i],C[(i+1)%n])),-8)}

  ctx.font='700 11px -apple-system,Helvetica,Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  var dot=function(p,c,i,isAct,col){

// magnifier shown above the point while it is dragged, so the finger does not hide the spot

  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();ctx.fillStyle='#26302a';ctx.fillRect(cx-R,cy-R,2*R,2*R);
  ctx.setTransform(1,0,0,1,0,0);

  try{ctx.drawImage(M.cv,Math.max(0,sx),Math.max(0,sy),sw,sw,(cx-R)*d,(cy-R)*d,2*R*d,2*R*d)}catch(e){}
  ctx.restore();

  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();ctx.lineWidth=1.5;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-14,cy);ctx.lineTo(cx-4,cy);ctx.moveTo(cx+4,cy);ctx.lineTo(cx+14,cy);ctx.moveTo(cx,cy-14);ctx.lineTo(cx,cy-4);ctx.moveTo(cx,cy+4);ctx.lineTo(cx,cy+14);ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.stroke();ctx.lineWidth=1.3;ctx.strokeStyle='#fff';ctx.stroke();

function drawSaved(ctx){

    Q.forEach(function(q){x0=Math.min(x0,q.x);x1=Math.max(x1,q.x);y0=Math.min(y0,q.y);y1=Math.max(y1,q.y)});

    ctx.setLineDash([6,4]);ctx.lineWidth=3.5;ctx.strokeStyle='rgba(0,0,0,.5)';ctx.stroke();ctx.lineWidth=1.6;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.stroke();ctx.setLineDash([]);

      var t=p.name+' · '+fa(p.area,S.settings.unit)+' '+UNIT[S.settings.unit].l,cx=(x0+x1)/2,cy=(y0+y1)/2;ctx.strokeText(t,cx,cy);ctx.fillText(t,cx,cy);ctx.textAlign='start'}

function mapScale(res){

  var key=Math.round(L/res)+'|'+L;if(key===M.lastScale)return;M.lastScale=key;
  el.firstChild.style.width=Math.round(L/res)+'px';el.lastChild.textContent=L>=1000?(L/1000)+' km':L+' m';

  var ids=Object.keys(M.ptrs);

    if(M.mv&&!M.view){M.g={t:'moveall',sx:p.x,sy:p.y,lx:p.x,ly:p.y,moved:false,multi:false,t0:Date.now()};return}
    var vi=(locked()||M.mv)?-1:hitVertex(p.x,p.y);
    M.g={t:vi>=0?'vertex':'pan',vi:vi,sx:p.x,sy:p.y,lx:p.x,ly:p.y,moved:false,multi:false,t0:Date.now()};
    if(vi>=0){var c=act()[vi],sp=toScr(c.lat,c.lon);M.g.ox=sp.x-p.x;M.g.oy=sp.y-p.y;M.g.backup=clone(c)}
  }else if(ids.length===2){
    var a=M.ptrs[ids[0]],b=M.ptrs[ids[1]],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    M.loupe=null;
    M.g={t:'pinch',multi:true,moved:true,d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:MS.zoom,geo:fromScr(mid.x,mid.y)};
  }
}
function pMove(e){
  var pt=M.ptrs[e.pointerId];if(!pt)return;var p=rel(e),g=M.g;pt.x=p.x;pt.y=p.y;if(!g)return;
  if(g.t==='pinch'){
    var ids=Object.keys(M.ptrs);if(ids.length<2)return;
    var a=M.ptrs[ids[0]],b=M.ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y)||1;
    setAnchor(g.geo,(a.x+b.x)/2,(a.y+b.y)/2,g.z0+Math.log(d/g.d0)/Math.LN2);scheduleDraw();return;
  }
  if(!g.moved&&Math.hypot(p.x-g.sx,p.y-g.sy)>8)g.moved=true;
  if(g.t==='pan'){panBy(p.x-g.lx,p.y-g.ly);g.lx=p.x;g.ly=p.y}
  else if(g.t==='moveall'){if(g.moved){shiftAll(p.x-g.lx,p.y-g.ly);g.lx=p.x;g.ly=p.y;scheduleDraw()}}
  else if(g.t==='vertex'&&g.moved){M.sel=g.vi;moveVertex(g.vi,p.x+g.ox,p.y+g.oy)}
}
function pUp(e){
  var pt=M.ptrs[e.pointerId];if(!pt)return;
  var g=M.g;delete M.ptrs[e.pointerId];var left=Object.keys(M.ptrs);
  if(!g)return;
  if(g.t==='pinch'){
    if(left.length===1){var r=M.ptrs[left[0]];M.g={t:'pan',vi:-1,sx:r.x,sy:r.y,lx:r.x,ly:r.y,moved:true,multi:true,t0:Date.now()}}
    else if(!left.length)M.g=null;
    saveView();return;
  }
  if(left.length)return;
  M.g=null;
  if(g.t==='moveall'){if(g.moved)saveDraft();M.lastPanel='';scheduleDraw();return}
  if(g.t==='vertex'){
    M.loupe=null;
    if(e.type==='pointercancel'){if(g.backup){var c=act()[g.vi];if(c)Object.keys(g.backup).forEach(function(k){c[k]=g.backup[k]})}M.sel=-1;scheduleDraw();return}
    if(g.moved){M.sel=-1;saveDraft();scheduleDraw();return}
    M.sel=g.vi;scheduleDraw();selectVertex(g.vi);return;
  }
  saveView();
  if(e.type==='pointercancel')return;
  if(g.t==='pan'&&!g.moved&&!g.multi&&Date.now()-g.t0<700){
    if(M.view){toast('You are viewing a saved plot. Tap Edit a copy to change it');return}
    if(M.split||M.mv)return;
    if(MS.add==='tap')addMapPoint(fromScr(g.sx,g.sy));
  }
}

function fitCorners(C,padBot){
  if(!C.length)return false;
  if(C.length===1){setAnchor(C[0],M.W/2,M.H/2,Math.max(MS.zoom,19));return true}
  var a=1e9,b=-1e9,c=1e9,d=-1e9;
  C.forEach(function(p){a=Math.min(a,p.lat);b=Math.max(b,p.lat);c=Math.min(c,p.lon);d=Math.max(d,p.lon)});
  var padT=140,padB=padBot||90,padL=36,padR=72,aw=Math.max(60,M.W-padL-padR),ah=Math.max(60,M.H-padT-padB);
  var w0=Math.max(1e-7,mX(d,0)-mX(c,0)),h0=Math.max(1e-7,mY(a,0)-mY(b,0));
  var z=Math.log(Math.min(aw/w0,ah/h0))/Math.LN2;z=Math.max(MINZ,Math.min(20.5,z));
  setAnchor({lat:(a+b)/2,lon:(c+d)/2},padL+aw/2,padT+ah/2,z);return true;
}

function mapSearch(q){

  if(res)res.innerHTML='<div class="small">Searching…</div>';
  fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q='+encodeURIComponent(q)).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(list){

}

// ---------- tape lengths ----------
var TP={n:4,u:'m',sides:[],diags:[],brg:0,loaded:false};
function tapeVals(){
  var f=TP.u==='ft'?0.3048:1,pv=function(t){var v=parseFloat(String(t||'').replace(',','.'));return v>0?v*f:NaN},n=TP.n,sides=[],diags=[];
  for(var i=0;i<n;i++)sides.push(pv(TP.sides[i]));
  for(var k=2;k<=n-2;k++)diags.push(pv(TP.diags[k-2]));
  return{sides:sides,diags:diags};
}
function tapeCalc(){
  var v=tapeVals(),miss=v.sides.some(function(x){return!(x>0)});
  if(miss)return{ok:false,err:'Type all '+TP.n+' side lengths'};
  var r=tapeSolve(v.sides,v.diags);if(!r.ok)return r;
  r.sig=tapeSigma(v.sides,v.diags);r.sidesM=v.sides;r.diagsM=v.diags;return r;
}
function tapeSheet(){
  if(!TP.loaded){TP.loaded=true;var t=S.draft.tape;if(t){TP.n=t.sides.length;TP.u=t.u||'m';TP.sides=t.sides.map(String);TP.diags=(t.diags||[]).map(String);TP.brg=t.brg||0}}
  var u=S.settings.unit,drawIn=function(){
    var n=TP.n,h='<h3>Tape lengths</h3><div class="mut small">Measure each side of the plot with a tape, going round in order. For a shape with 4 or more corners also measure the diagonals from point 1, so the shape is fixed.</div>';
    h+='<div class="row" style="align-items:center"><div style="flex:1.2">Corners</div><select id="tN">'+[3,4,5,6,7,8].map(function(x){return'<option'+(x===n?' selected':'')+'>'+x+'</option>'}).join('')+'</select><select id="tU"><option value="m"'+(TP.u==='m'?' selected':'')+'>metres</option><option value="ft"'+(TP.u==='ft'?' selected':'')+'>feet</option></select></div>';
    h+='<div class="mut small" style="margin-top:10px">Sides</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
    for(var i=0;i<n;i++)h+='<div><label style="margin:0 0 3px">'+(i+1)+' &rarr; '+((i+1)%n+1)+'</label><input data-s="'+i+'" inputmode="decimal" value="'+esc(TP.sides[i]||'')+'" autocomplete="off"></div>';
    h+='</div>';
    if(n>=4){h+='<div class="mut small" style="margin-top:10px">Diagonals from point 1</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
      for(var k=2;k<=n-2;k++)h+='<div><label style="margin:0 0 3px">1 &rarr; '+(k+1)+'</label><input data-d="'+(k-2)+'" inputmode="decimal" value="'+esc(TP.diags[k-2]||'')+'" autocomplete="off"></div>';
      h+='</div>'}
    h+='<div id="tRes"></div>';
    h+='<label>Direction of side 1 (0 = north, 90 = east)</label><input id="tB" inputmode="decimal" value="'+TP.brg+'" autocomplete="off">';
    h+='<div class="row"><button class="pri" id="tPlace">Put on the map</button><button id="tX">Close</button></div>';
    sheet(h);
    var upd=function(){
      var r=tapeCalc(),el=$('#tRes');
      if(!r.ok){el.innerHTML='<div class="mut small" style="margin-top:10px">'+esc(r.err||'')+'</div>';$('#tPlace').disabled=true;return}
      el.innerHTML='<div style="margin-top:10px"><div class="big-num" style="font-size:28px">'+fa(r.area,u)+' <small>'+UNIT[u].l+'</small></div><div class="mut small">'+fa(r.area,'sqm')+' sq m · perimeter '+num(r.per,1)+' m · typical error ±'+fa(r.sig,u)+' '+UNIT[u].l+'</div>'+(r.warn?'<div class="warnbox">'+esc(r.warn)+'</div>':'')+svgPoly({P:r.P,H:[],sides:r.sidesM})+'</div>';
      $('#tPlace').disabled=!!r.warn&&/cross|wraps/.test(r.warn);
    };
    $('#sheet').querySelectorAll('input[data-s]').forEach(function(x){x.oninput=function(){TP.sides[+x.dataset.s]=x.value;upd()}});
    $('#sheet').querySelectorAll('input[data-d]').forEach(function(x){x.oninput=function(){TP.diags[+x.dataset.d]=x.value;upd()}});
    $('#tN').onchange=function(){TP.n=+this.value;drawIn()};
    $('#tU').onchange=function(){TP.u=this.value;upd()};
    $('#tB').oninput=function(){TP.brg=parseFloat(this.value.replace(',','.'))||0};
    $('#tX').onclick=closeSheet;
    $('#tPlace').onclick=tapePlace;
    upd();
  };
  drawIn();
}
function tapePlace(){
  var r=tapeCalc();if(!r.ok)return;
  var org=(S.tab==='map'||!(S.gps.lat!=null&&Date.now()-S.gps.rx<30000))?{lat:MS.lat,lon:MS.lon}:{lat:S.gps.lat,lon:S.gps.lon};
  var go=function(){
    var d=S.draft;d.corners=tapeCorners(r.P,org.lat,org.lon,TP.brg);d.holes=[];d.mode='corners';
    d.tape={sides:TP.sides.slice(0,TP.n),diags:TP.diags.slice(0,Math.max(0,TP.n-3)),u:TP.u,brg:TP.brg};
    saveDraft();closeSheet();M.ring=-1;M.split=null;M.view=null;M.refit=true;S.tab='map';render();gcPhotos();
    toast('Plot placed in the middle of the map. Use Tools → Move or turn the plot to put it on the land');
  };
  if(S.draft.corners.length)choose('Replace the current points?','The points of the current plot will be replaced by the plot drawn from the tape lengths.',[{label:'Replace',val:true,cls:'danger'},{label:'Cancel',val:false}]).then(function(ok){if(ok)go()});else go();
}

// ---------- split ----------
function longestSide(an){var b=-1,k=0;an.sides.forEach(function(l,i){if(l>b){b=l;k=i}});return k}
function openSplit(){
  var o=cobj(),mode=o.mode||'corners',an=o.corners.length>=3?analyze(o.corners,mode,holesOf(o)):null;
  if(!an){toast('Add at least 3 points first');return}
  if(an.cross){toast('The boundary lines cross. Fix the points first');return}
  M.split={dir:'perp',ref:longestSide(an),kind:'equal',nn:2,vals:{ratio:'1:2',areas:'',width:'3'},an:an,res:null,geo:null,cutGeo:null,err:''};
  M.sel=-1;M.ring=-1;M.mv=false;closePop();splitRecalc();M.lastPanel='';mapBottom();
  var bh=$('#mbot')?$('#mbot').offsetHeight:300;if(fitCorners(o.corners,bh+30))saveView();scheduleDraw();
}
function closeSplit(){M.split=null;M.lastPanel='';mapBottom();scheduleDraw()}
function splitCfg(sp){
  var c={dir:sp.dir,ref:sp.ref},v=sp.vals;
  if(sp.kind==='equal')c.n=sp.nn;
  else if(sp.kind==='ratio')c.ratio=parseNums(v.ratio);
  else if(sp.kind==='areas')c.areas=parseNums(v.areas).map(function(x){return toSqm(x,S.settings.unit)});
  else{c.dir='par';c.widths=parseNums(v.width)}
  return c;
}
function splitRecalc(){
  var sp=M.split,cfg=splitCfg(sp),err='';
  if(sp.kind==='ratio'&&cfg.ratio.length<2)err='Type two or more numbers, like 1:2 or 1:1:2';
  else if(sp.kind==='areas'&&(!cfg.areas.length||cfg.areas.some(function(x){return!(x>0)})))err='Type the size of each part except the last, like 10 or 10, 5';
  else if(sp.kind==='road'&&(!cfg.widths.length||!(cfg.widths[0]>0)))err='Type the road width in metres';
  sp.res=null;sp.geo=null;sp.cutGeo=null;sp.err=err;
  if(!err){
    var r=splitCompute(sp.an.P,sp.an.H,cfg);
    if(r.ok){var an=sp.an;sp.res=r;
      sp.geo=r.parts.map(function(pt){return pt.poly.map(function(q){return fromXY(q.x,q.y,an.lat0,an.lon0)})});
      sp.cutGeo=r.cuts.map(function(c){return{a:fromXY(c.a.x,c.a.y,an.lat0,an.lon0),b:fromXY(c.b.x,c.b.y,an.lat0,an.lon0),len:c.len}});
    }else sp.err=r.err;
  }
  M.lastPanel='';
}
function splitResHTML(){
  var sp=M.split,u=S.settings.unit,l=UNIT[u].l;
  if(sp.err)return'<div class="warnbox" style="margin-top:8px;color:#16211a">'+esc(sp.err)+'</div>';
  var r=sp.res,h='<div class="tiny" style="margin-top:8px">'+r.parts.map(function(p,i){return'<span style="white-space:nowrap"><span class="sw" style="background:'+PALETTE[i%PALETTE.length]+'"></span><b>'+(i+1)+'</b> '+fa(p.area,u)+' '+l+' ('+(p.area/r.total*100).toFixed(1)+'%)</span>'}).join(' &nbsp; ')+'</div>';
  if(r.cuts.length)h+='<div class="tiny">Cut length '+fmtLen(r.cuts.reduce(function(a,c){return a+c.len},0))+'</div>';
  if(r.warn)h+='<div class="warnbox" style="margin-top:6px;color:#16211a">'+esc(r.warn)+'</div>';

}
function refName(sp){var n=sp.an.n,r=sp.ref%n;return sp.dir==='fan'?'Corner '+(r+1):'Side '+(r+1)+' (point '+(r+1)+' &rarr; '+((r+1)%n+1)+', '+fmtLen(sp.an.sides[r])+')'}
function splitCardHTML(){

  else if(sp.kind==='areas')h+='<input type="text" id="spA" inputmode="text" value="'+esc(sp.vals.areas)+'" placeholder="10, 5" autocomplete="off"><div class="tiny">Size of each part in '+UNIT[u].l+'. What is left becomes the last part.</div>';
  else h+='<input type="text" id="spW" inputmode="decimal" value="'+esc(sp.vals.width)+'" placeholder="3" autocomplete="off"><div class="tiny">Road width in metres along the chosen side. The rest is one part.</div>';

  return h;

function bindSplit(el){
  var sp=M.split,n=sp.an.n,after=function(){splitRecalc();mapBottom();scheduleDraw()},q=function(s){return el.querySelector(s)};
  el.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){sp.dir=b.dataset.d;after()}});
  el.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){sp.kind=b.dataset.k;if(sp.kind==='road')sp.dir='par';after()}});

  if(q('#spP'))q('#spP').onclick=function(){sp.nn=Math.min(12,sp.nn+1);after()};
  var live=function(id,key){var x=q(id);if(x)x.oninput=function(){sp.vals[key]=this.value;splitRecalc();$('#spres').innerHTML=splitResHTML();var b=q('#spSave');if(b)b.disabled=!sp.res;scheduleDraw()}};

  q('#spIdeas').onclick=ideasSheet;
  q('#spSave').onclick=saveParts;

}
function ideasSheet(){
  var sp=M.split,an=sp.an,ideas=splitIdeas(an.P,an.H),u=S.settings.unit;
  var h='<h3>Split ideas</h3><div class="mut small">Tap one to try it on the map. You can change the side, the number of parts or the shares after that.</div><div class="ideas">';
  ideas.forEach(function(it){h+='<button class="idea" data-id="'+it.id+'">'+svgParts(an.P,it.res,150,110,true)+'<b>'+esc(it.title)+'</b><span>'+esc(it.desc)+'</span><span>'+it.res.parts.map(function(p){return fa(p.area,u)}).join(' · ')+' '+UNIT[u].l+'</span></button>'});
  h+='</div><div class="mut small" style="margin-top:12px"><b>Things to check before you divide</b><ul class="tips"><li>Give every part a way out to the road. Parts that all touch the long side (Across side) do that.</li><li>Keep a strip for a path or road if parts sit behind each other.</li><li>On sloping land, cut across the slope so each part gets some high and low ground.</li><li>Corner plots with two roads usually sell for more. Equal area does not always mean equal value.</li><li>The cuts are measured on the map. Mark them on the ground with a tape and check with the local surveyor before registering.</li></ul></div><div class="row"><button id="idX">Close</button></div>';
  sheet(h);$('#idX').onclick=closeSheet;
  $('#sheet').onclick=function(e){

  };
}
function saveParts(){
  var sp=M.split,res=sp.res,an=sp.an;if(!res)return;
  var o=cobj(),mode=o.mode||'corners',accs=o.corners.map(function(c){return c.acc||3}).sort(function(a,b){return a-b}),med=accs[Math.floor(accs.length/2)]||1;
  var nm=(o.name||'Plot').trim()||'Plot',made=[],hs=o.holes||[],HX=an.H;
  res.parts.forEach(function(pt,i){
    if(pt.poly.length<3)return;
    var corners=pt.poly.map(function(q){
      var j=-1;for(var k=0;k<an.P.length;k++){if(Math.abs(an.P[k].x-q.x)<1e-4&&Math.abs(an.P[k].y-q.y)<1e-4){j=k;break}}
      if(j>=0){var c=clone(o.corners[j]);delete c.note;delete c.ph;return c}
      var g=fromXY(q.x,q.y,an.lat0,an.lon0);return{lat:g.lat,lon:g.lon,acc:med,n:1,total:1,alt:null,altAcc:null,src:'cut'};
    });
    var holes=[];HX.forEach(function(H,hi){var c=centroid(H);if(pointInPoly(c,pt.poly))holes.push(clone(hs[hi]))});
    made.push({name:nm+' - part '+(i+1),place:o.place||'',notes:'Split from '+nm+' ('+fa(pt.area,S.settings.unit)+' '+UNIT[S.settings.unit].l+')',mode:mode,corners:corners,holes:holes});
  });
  var go=function(del){
    var base=Date.now();
    made.reverse().forEach(function(m,i){var p=buildPlot(m);p.ts=base+i;p.splitOf=o.id||null;S.plots.unshift(p)});
    if(del&&o.id)S.plots=S.plots.filter(function(x){return x.id!==o.id});
    savePlots();M.split=null;M.view=null;S.tab='plots';S.viewId=null;render();gcPhotos();toast(made.length+' parts saved as plots');
  };
  var cross=HX.some(function(H,hi){var c=0;res.parts.forEach(function(pt){if(pt.poly.length>=3&&H.some(function(p){return pointInPoly(p,pt.poly)}))c++});return c>1});
  var msg='Each part is saved as a separate plot.'+(cross?' A cut passes through an excluded area, so check the areas of the parts next to it.':'');
  if(M.view)choose('Save '+made.length+' parts',msg,[{label:'Save, keep the original',val:'k',cls:'pri'},{label:'Save, delete the original',val:'d',cls:'danger'},{label:'Cancel',val:'c'}]).then(function(v){if(v==='k')go(false);else if(v==='d')go(true)});
  else choose('Save '+made.length+' parts',msg,[{label:'Save parts',val:'k',cls:'pri'},{label:'Cancel',val:'c'}]).then(function(v){if(v==='k')go(false)});
}

// ---------- screens ----------
function render(){
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===S.tab)});
  document.body.classList.toggle('maptab',S.tab==='map');
  if(S.tab!=='map'){M.cv=null;M.raf=0}
  if(S.tab==='measure')renderMeasure();else if(S.tab==='map')renderMap();else if(S.tab==='plots')renderPlots();else renderMore();
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){leaveModes();S.tab=b.dataset.tab;S.viewId=null;M.view=null;render()}});

function renderMeasure(){
  if(S.tab!=='measure')return;
  var d=S.draft,n=d.corners.length,an=anOf(d),busy=!!(S.cap||S.walk);
  var h='<div class="card"><label>Plot name</label><input id="fName" placeholder="e.g. Home plot" value="'+esc(d.name)+'" autocomplete="off">';
  h+='<label>Place</label><input id="fPlace" placeholder="e.g. Malappuram, Village / survey no." value="'+esc(d.place)+'" autocomplete="off">';
  h+='<div class="seg"><button data-mode="corners" class="'+(d.mode==='corners'?'on':'')+'"'+(busy?' disabled':'')+'>Corner points</button><button data-mode="walk" class="'+(d.mode==='walk'?'on':'')+'"'+(busy?' disabled':'')+'>Walk boundary</button></div></div>';
  h+='<div class="card"><h2>'+(d.mode==='corners'?'Corners':'Walk')+'</h2>';
  if(d.mode==='corners'){
    if(S.cap){
      var idx=S.cap.replace>=0?S.cap.replace+1:n+1;
      h+='<div><b>Capturing corner '+idx+'</b>. Stand still at the corner.</div><div class="bar"><i id="capbar"></i></div><div class="mut small" id="captxt">Starting…</div><div class="row" style="margin-top:12px"><button class="pri" id="bUse">Use now</button><button id="bCancel">Cancel</button></div>';
    }else{
      h+='<button class="pri big" id="bCap">Capture corner '+(n+1)+'</button><div class="mut small" style="margin-top:8px">Stand on the corner mark. Hold the phone steady in front of your chest, above the mark, and do not walk or sway. The phone averages GPS for '+S.settings.dur+' s and skips readings while it is moving. Go around the plot in order. No GPS? Use the satellite map instead.</div>';
      if(n){h+='<div class="corners">'+d.corners.map(function(c,i){return'<button data-c="'+i+'">'+(i+1)+' · '+srcLabel(c)+'±'+c.acc.toFixed(1)+' m</button>'}).join('')+'</div><div class="row" style="margin-top:12px"><button id="bUndo">Undo last</button><button id="bClear" class="danger">Start over</button></div>'}
    }
  }else{
    if(S.walk){
      h+='<div><b>Walking…</b> Follow the boundary and return to where you started.</div><div class="mut small" id="walktxt" style="margin:8px 0">Waiting for GPS…</div><div class="row"><button class="pri" id="bWalkEnd">Finish</button><button id="bWalkCancel">Cancel</button></div>';
    }else{
      h+='<button class="pri big" id="bWalk">'+(n?'Walk again':'Start walking')+'</button><div class="mut small" style="margin-top:8px">Start at one corner, walk slowly along the boundary, come back to the start, then tap Finish. Good for large plots. Corners get slightly rounded.</div>';
      if(n)h+='<div class="row" style="margin-top:12px"><button id="bClear" class="danger">Start over</button></div>';
    }
  }
  if(!busy)h+='<button id="bToMap" style="width:100%;margin-top:12px">&#128752;&#65039; '+(n?'View on satellite map':'Mark on satellite map (no GPS needed)')+'</button><button id="bTape" style="width:100%;margin-top:8px">&#128208; Enter tape lengths</button>';
  h+='</div>';
  if(an&&!busy){
    h+='<div class="card"><h2>Result</h2>'+resultHTML(an,d.mode,true,d)+'<button id="bRec" style="width:100%;margin-top:10px">&#128203; '+(d.rec?'Change record area':'Compare with record area')+'</button><label>Notes (optional)</label><input id="fNotes" value="'+esc(d.notes)+'" placeholder="e.g. east side near road, tree cover" autocomplete="off"><button class="pri big" id="bSave" style="margin-top:12px">Save plot</button></div>';
  }else if(!busy){
    h+='<div class="mut small" style="padding:0 4px">Need at least 3 corners to calculate the area.</div>';
  }
  $('#app').innerHTML=h;
  var q=function(s){return $(s)};
  if(q('#fName'))q('#fName').oninput=function(){d.name=this.value;saveDraft()};
  if(q('#fPlace'))q('#fPlace').oninput=function(){d.place=this.value;saveDraft()};
  if(q('#fNotes'))q('#fNotes').oninput=function(){d.notes=this.value;saveDraft()};
  document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){if(busy)return;if(d.mode!==b.dataset.mode&&d.corners.length){choose('Switch mode?','This clears the corners you have so far.',[{label:'Switch',val:true,cls:'pri'},{label:'Keep',val:false}]).then(function(ok){if(ok){d.mode=b.dataset.mode;d.corners=[];d.holes=[];d.tape=null;saveDraft();renderMeasure();gcPhotos()}})}else{d.mode=b.dataset.mode;saveDraft();renderMeasure()}}});
  if(q('#bCap'))q('#bCap').onclick=function(){startCapture()};
  if(q('#bUse'))q('#bUse').onclick=finishCapture;
  if(q('#bCancel'))q('#bCancel').onclick=cancelCapture;
  if(q('#bUndo'))q('#bUndo').onclick=function(){d.corners.pop();saveDraft();renderMeasure();gcPhotos()};
  if(q('#bClear'))q('#bClear').onclick=function(){choose('Start over?','All corners of this plot will be removed.',[{label:'Remove all',val:true,cls:'danger'},{label:'Keep',val:false}]).then(function(ok){if(ok){d.corners=[];d.holes=[];d.tape=null;saveDraft();renderMeasure();gcPhotos()}})};
  document.querySelectorAll('.corners button').forEach(function(b){b.onclick=function(){var i=+b.dataset.c;choose('Corner '+(i+1),(placed(d.corners[i])?'Placed without GPS, about ±':'Accuracy ±')+d.corners[i].acc.toFixed(1)+(placed(d.corners[i])?' m.':' m from '+d.corners[i].n+' readings.'),[{label:'Retake',val:'r',cls:'pri'},{label:'Delete',val:'d',cls:'danger'},{label:'Cancel',val:'c'}]).then(function(v){if(v==='r')startCapture(i);else if(v==='d'){d.corners.splice(i,1);saveDraft();renderMeasure();gcPhotos()}})}});
  if(q('#bWalk'))q('#bWalk').onclick=startWalk;
  if(q('#bWalkEnd'))q('#bWalkEnd').onclick=finishWalk;
  if(q('#bWalkCancel'))q('#bWalkCancel').onclick=cancelWalk;
  if(q('#bSave'))q('#bSave').onclick=savePlot;
  if(q('#bToMap'))q('#bToMap').onclick=function(){M.refit=true;S.tab='map';render()};
  if(q('#bTape'))q('#bTape').onclick=function(){tapeSheet()};
  if(q('#bRec'))q('#bRec').onclick=function(){recSheet(d,renderMeasure)};
  updateLive();
}

function buildPlot(o){
  var an=anOf(o,o.mode||'corners');
  return{id:uid(),name:(o.name||'').trim()||('Plot '+fdate(Date.now())),place:(o.place||'').trim(),notes:(o.notes||'').trim(),ts:Date.now(),mode:o.mode||'corners',corners:o.corners,holes:o.holes||[],rec:o.rec||null,tape:o.tape||null,area:an.net,per:an.per,sig:an.sig,src:an.meth};
}
function savePlot(){
  var d=S.draft,an=anOf(d);if(!an)return;
  var p=buildPlot(d);
  S.plots.unshift(p);savePlots();
  S.draft=blankDraft(d.mode);saveDraft();M.ring=-1;
  S.tab='plots';S.viewId=p.id;render();toast('Saved');
}

function renderPlots(){
  if(S.viewId){var p=S.plots.filter(function(x){return x.id===S.viewId})[0];if(p)return renderDetail(p);S.viewId=null}
  var f=S.filter.toLowerCase(),list=S.plots.filter(function(p){return!f||(p.name+' '+p.place).toLowerCase().indexOf(f)>=0});
  var h='<div class="card"><input id="fSearch" placeholder="Search by name or place" value="'+esc(S.filter)+'" autocomplete="off"></div>';
  if(!S.plots.length)h+='<div class="mut" style="padding:20px 8px;text-align:center">No saved plots yet. Measure one on the first tab.</div>';
  list.forEach(function(p){
    h+='<button class="plotitem" data-id="'+p.id+'"><b>'+esc(p.name)+'</b><div class="mut small">'+esc(p.place||'No place')+' · '+fdate(p.ts)+(p.src&&p.src!=='gps'?' · '+methLabel(p.src):'')+'</div><div style="margin-top:6px;font-weight:700">'+fa(p.area,S.settings.unit)+' '+UNIT[S.settings.unit].l+' <span class="mut small" style="font-weight:400">('+fa(p.area,S.settings.unit==='acre'?'cent':'acre')+' '+UNIT[S.settings.unit==='acre'?'cent':'acre'].l+')</span></div></button>';
  });
  $('#app').innerHTML=h;
  var s=$('#fSearch');if(s)s.oninput=function(){S.filter=this.value;var pos=this.selectionStart;renderPlots();var n=$('#fSearch');n.focus();n.setSelectionRange(pos,pos)};
  document.querySelectorAll('.plotitem').forEach(function(b){b.onclick=function(){S.viewId=b.dataset.id;renderPlots();window.scrollTo(0,0)}});
}

function summary(p,an){
  var k=haAre(an.net),t=p.name+(p.place?' ('+p.place+')':'')+'\nDate: '+fdate(p.ts)+'\n';
  t+='Area: '+fa(an.net,'cent')+' cent = '+fa(an.net,'acre')+' acre = '+fa(an.net,'sqm')+' sq m = '+fa(an.net,'sqft')+' sq ft\n';
  if(an.holeArea>0)t+='Plot '+fa(an.area,'cent')+' cent, excluded '+fa(an.holeArea,'cent')+' cent ('+an.H.length+' area'+(an.H.length===1?'':'s')+' such as house or pond)\n';
  var rc=p.rec&&recCmp(an.net,an.sig,p.rec);
  if(rc)t+='Record area: '+fa(p.rec.a,p.rec.u)+' '+UNIT[p.rec.u].l+'. Measured is '+(rc.pct>0?'+':'-')+Math.abs(rc.pct).toFixed(1)+'% ('+(rc.within?'within':'more than')+' the measuring error)\n';
  t+='Method: '+(an.meth==='map'?'traced on satellite map (no GPS)':an.meth==='tape'?'tape lengths':an.meth==='mixed'?'GPS + satellite map':'phone GPS')+'\n';
  t+='Kerala style: '+k.ha+' Ha '+k.are+' Ar '+k.m2.toFixed(1)+' m2\nPerimeter: '+an.per.toFixed(1)+' m\nEstimated error: +/-'+an.sig.toFixed(1)+' sq m ('+(an.rel*100).toFixed(1)+'%)\n';
  if(an.ngps>0&&an.slope&&an.slope.ok)t+=an.slope.detectable?('Slope: about '+an.slope.slopeDeg.toFixed(0)+' deg, downhill '+compass8(an.slope.aspect)+'; area along the slope '+fa(an.surface,'cent')+' cent\n'):('Slope: none detected (under ~'+Math.round(an.slope.limitDeg)+' deg)\n');
  if(p.notes)t+='Notes: '+p.notes+'\n';
  t+='Corners (lat, lon, accuracy):\n'+p.corners.map(function(c,i){return(i+1)+': '+c.lat.toFixed(7)+', '+c.lon.toFixed(7)+' ('+srcLabel(c).replace(' ',', ')+'+/-'+c.acc.toFixed(1)+' m)'+(c.note?' - '+c.note:'')}).join('\n');
  return t;
}
function geojson(plots){
  var ring=function(C){var r=C.map(function(c){return[+c.lon.toFixed(8),+c.lat.toFixed(8)]});r.push(r[0]);return r};
  return JSON.stringify({type:'FeatureCollection',features:plots.map(function(p){var rings=[ring(p.corners)];(p.holes||[]).forEach(function(h){if(h.corners&&h.corners.length>=3)rings.push(ring(h.corners))});return{type:'Feature',properties:{name:p.name,place:p.place,notes:p.notes,area_sqm:+p.area.toFixed(2),area_cent:+UNIT.cent.f(p.area).toFixed(3),perimeter_m:+p.per.toFixed(2),record_sqm:p.rec?+p.rec.a.toFixed(2):null,method:p.src==='map'?'satellite map':p.src==='tape'?'tape lengths':p.src==='mixed'?'gps+map':'gps',date:new Date(p.ts).toISOString()},geometry:{type:'Polygon',coordinates:rings}}})},null,1);
}

function wrapText(x,text,maxW){var words=String(text).split(/\s+/),lines=[],cur='';words.forEach(function(w){var t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t});if(cur)lines.push(cur);return lines}
function planCanvas(p,an,pw,ph){
  var cv=document.createElement('canvas');cv.width=pw;cv.height=ph;var x=cv.getContext('2d'),m=80,u=S.settings.unit,F='-apple-system,Helvetica,Arial,sans-serif';
  x.fillStyle='#fff';x.fillRect(0,0,pw,ph);x.textBaseline='alphabetic';

  x.font='28px '+F;x.fillStyle='#5d6b61';x.fillText((p.place?p.place+'   ·   ':'')+fdate(p.ts),m,166);
  var bx=m,by=206,bw=pw-2*m,bh=Math.round(bw*0.8);

  var f=fitBox(an.P,bw,bh,120),pt=function(q){var r=f.pt(q);return{x:bx+r.x,y:by+r.y}},Q=an.P.map(pt);
  x.lineJoin='round';
  x.beginPath();Q.forEach(function(q,i){if(i)x.lineTo(q.x,q.y);else x.moveTo(q.x,q.y)});x.closePath();x.fillStyle='rgba(31,122,77,.16)';x.fill();x.lineWidth=6;x.strokeStyle='#1f7a4d';x.stroke();
  an.H.forEach(function(h){var R=h.map(pt);x.beginPath();R.forEach(function(q,i){if(i)x.lineTo(q.x,q.y);else x.moveTo(q.x,q.y)});x.closePath();x.fillStyle='rgba(192,57,43,.28)';x.fill();x.setLineDash([14,9]);x.lineWidth=4;x.strokeStyle='#c0392b';x.stroke();x.setLineDash([])});
  if(Q.length<=14){
    x.font='700 26px '+F;x.textAlign='center';x.lineWidth=7;x.strokeStyle='#fff';x.fillStyle='#16211a';
    Q.forEach(function(a,i){var b=Q[(i+1)%Q.length],ang=Math.atan2(b.y-a.y,b.x-a.x);if(ang>Math.PI/2)ang-=Math.PI;else if(ang<-Math.PI/2)ang+=Math.PI;
      x.save();x.translate((a.x+b.x)/2,(a.y+b.y)/2);x.rotate(ang);var t=num(an.sides[i],1)+' m';x.strokeText(t,0,-14);x.fillText(t,0,-14);x.restore()});
    Q.forEach(function(q,i){x.beginPath();x.arc(q.x,q.y,21,0,7);x.fillStyle='#1f7a4d';x.fill();x.lineWidth=3;x.strokeStyle='#fff';x.stroke();x.fillStyle='#fff';x.font='700 24px '+F;x.fillText(String(i+1),q.x,q.y+8)});
  }
  x.textAlign='center';x.fillStyle='#5d6b61';x.font='700 30px '+F;x.fillText('N',bx+bw-50,by+48);x.beginPath();x.moveTo(bx+bw-50,by+60);x.lineTo(bx+bw-50,by+120);x.moveTo(bx+bw-50,by+60);x.lineTo(bx+bw-62,by+80);x.moveTo(bx+bw-50,by+60);x.lineTo(bx+bw-38,by+80);x.lineWidth=4;x.strokeStyle='#5d6b61';x.stroke();
  var steps=[1,2,5,10,20,50,100,200,500],L=steps[0];steps.forEach(function(v){if(v*f.sc<=bw*0.3)L=v});
  var sx=bx+40,sy=by+bh-46,sl=L*f.sc;x.beginPath();x.moveTo(sx,sy-12);x.lineTo(sx,sy);x.lineTo(sx+sl,sy);x.lineTo(sx+sl,sy-12);x.lineWidth=4;x.strokeStyle='#16211a';x.stroke();x.textAlign='left';x.font='700 24px '+F;x.fillStyle='#16211a';x.fillText(L+' m',sx,sy+30);
  x.textAlign='left';var y=by+bh+84;
  x.font='800 80px '+F;x.fillStyle='#16211a';x.fillText(fa(an.net,u)+' '+UNIT[u].l,m,y);
  x.font='30px '+F;x.fillStyle='#5d6b61';var k=haAre(an.net);y+=52;
  x.fillText(['cent','acre','sqm','sqft'].filter(function(v){return v!==u}).map(function(v){return fa(an.net,v)+' '+UNIT[v].l}).join('   ·   '),m,y);
  y+=44;x.fillText(k.ha+' Ha '+k.are+' Ar '+k.m2.toFixed(1)+' m²   ·   Perimeter '+num(an.per,1)+' m',m,y);
  if(an.holeArea>0){y+=44;x.fillText('Plot '+fa(an.area,u)+' − excluded '+fa(an.holeArea,u)+' '+UNIT[u].l+' (house, pond …)',m,y)}
  y+=44;x.fillText('Typical error ±'+num(an.rel*100,1)+'%   ·   '+methLabel(an.meth),m,y);
  var rc=p.rec&&recCmp(an.net,an.sig,p.rec);
  if(rc){y+=56;x.font='700 32px '+F;x.fillStyle=rc.within?'#1f7a4d':'#b7791f';x.fillText('Record '+fa(p.rec.a,p.rec.u)+' '+UNIT[p.rec.u].l+'  →  measured '+(rc.pct>0?'+':'−')+Math.abs(rc.pct).toFixed(1)+'%'+(rc.within?' (within error)':''),m,y)}

function planBlob(p,an,kind){
  return new Promise(function(res,rej){
    var cv=planCanvas(p,an,1240,1754);
    if(kind==='png')cv.toBlob(function(b){b?res(b):rej(new Error('png'))},'image/png');
    else{var url=cv.toDataURL('image/jpeg',0.92),bin=atob(url.split(',')[1]),u8=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);res(new Blob([pdfFromJpeg(u8,1240,1754,595,842)],{type:'application/pdf'}))}
  });
}
function fileBase(p){return(p.name.replace(/[^\w\-]+/g,'_')||'plot')}

  if(p.tape&&p.tape.sides)h+='<div class="card"><h2>Tape lengths</h2><div class="small">Sides: '+p.tape.sides.map(function(v,i){return(i+1)+'→'+((i+1)%p.tape.sides.length+1)+' <b>'+esc(v)+'</b>'}).join(' · ')+(p.tape.diags&&p.tape.diags.length?'<br>Diagonals: '+p.tape.diags.map(function(v,i){return'1→'+(i+3)+' <b>'+esc(v)+'</b>'}).join(' · '):'')+' ('+(p.tape.u==='ft'?'feet':'metres')+')</div></div>';

  $('#bRename').onclick=function(){

}

function renderMore(){
  var st=S.settings;
  var opt=function(vals,cur,lab){return vals.map(function(v){return'<option value="'+v+'"'+(String(cur)===String(v)?' selected':'')+'>'+(lab?lab(v):v)+'</option>'}).join('')};
  var h='<div class="card"><h2>Settings</h2><label>Averaging time per corner</label><select id="sDur">'+opt([15,30,45,60,90],st.dur,function(v){return v+' seconds'})+'</select>';
  h+='<label>Ignore GPS readings worse than</label><select id="sAcc">'+opt([8,12,20,30,50],st.maxAcc,function(v){return'±'+v+' m'})+'</select>';
  h+='<label>Main area unit</label><select id="sUnit"><option value="cent"'+(st.unit==='cent'?' selected':'')+'>cent</option><option value="acre"'+(st.unit==='acre'?' selected':'')+'>acre</option><option value="sqm"'+(st.unit==='sqm'?' selected':'')+'>sq m</option><option value="sqft"'+(st.unit==='sqft'?' selected':'')+'>sq ft</option></select></div>';
  h+='<div class="card"><h2>Backup</h2><div class="mut small">Saved plots live only on this phone, inside this app. Take a backup now and then.</div><div class="row" style="margin-top:10px"><button id="bExp" class="pri">Export all</button><button id="bImp">Import</button></div><div class="row" style="margin-top:8px"><button id="bGeoAll">All as GeoJSON</button><button id="bKmlAll">All as KML</button></div><div class="mut small" style="margin-top:8px">'+S.plots.length+' plot'+(S.plots.length===1?'':'s')+' saved. Photos of points stay on this phone and are not in the backup file.</div></div>';
  h+='<div class="card"><h2>How accurate is this?</h2><div class="small">Phone GPS alone is usually off by about 1 to 5 m in the open, and worse under trees or next to buildings. The error in the area depends on plot size:</div><ul class="tips small"><li><b>Acres:</b> usually around 1% or better. Fine for estimates.</li><li><b>10 to 50 cent:</b> a few percent. Rough.</li><li><b>1 to 10 cent:</b> error is too big. Use tape or a laser distance meter.</li></ul><div class="small" style="margin-top:8px">This is not centimetre accuracy and not a legal survey. For that you need an RTK GNSS receiver or a licensed surveyor.</div><div class="small" style="margin-top:8px"><b>Sloping land:</b> the main number is the flat map (horizontal) area. The app also estimates the slope from GPS height. A web app cannot read the iPhone barometer or LiDAR, so small slopes are not detected.</div></div>';
  h+='<div class="card"><h2>Satellite map</h2><ul class="tips small"><li>The <b>Map</b> tab shows satellite pictures (Esri). Tap to add points, drag a point to correct it, and the distances, perimeter and area show at the top.</li><li><b>No GPS needed.</b> Points placed on the map give an approximate area. This is as good as the picture: sharp, recent and not hidden by trees. Boundaries under trees are guesses.</li><li>Use <b>Centre pin</b> for careful work: move the map until the cross is on the corner, then tap Add point.</li><li>The pictures need internet. Measuring with GPS works without it.</li><li>If a tile says &ldquo;Map data not yet available&rdquo;, zoom out one step.</li></ul></div>';
  h+='<div class="card"><h2>More tools (Map tab &rarr; Tools)</h2><ul class="tips small"><li><b>Split:</b> divide a plot into equal parts, by ratio, by cents, or with a road strip. Ideas are shown as small pictures. Save the parts as separate plots.</li><li><b>Exclude an area:</b> mark a house or pond. Its area is taken out and the net area is shown.</li><li><b>Record area:</b> type the area from the deed or Ente Bhoomi to see the difference in %.</li><li><b>Tape lengths:</b> type the side lengths (and diagonals) and the app draws the plot and works out the area. A tape is far more exact than GPS for small plots.</li><li><b>Magnifier:</b> when you drag a point, a round magnifier shows the spot above your finger.</li><li><b>Point notes and photos:</b> tap a point to add a note or a photo.</li><li>On a saved plot you can make a <b>plan PDF</b>, a picture, or a <b>KML</b> file for Google Earth.</li></ul></div>';
  h+='<div class="card"><h2>Tips for best results</h2><ul class="tips small"><li>Stand in the open, away from trees, walls and vehicles.</li><li>Wait until the GPS chip at the top shows green or amber before you capture.</li><li>Take all corners in one session, within about 15 minutes. Common GPS errors then cancel out in the area.</li><li>Take corners in order around the plot (clockwise or anticlockwise).</li><li>Keep the phone steady and the screen on. The app asks the phone to stay awake.</li><li>Measure again on another day or time of day and compare. If the two areas differ, trust neither fully.</li></ul></div>';
  h+='<div class="card"><h2>Install on iPhone</h2><ul class="tips small"><li>Open this page in Safari, tap Share, then <b>Add to Home Screen</b>.</li><li>Always open it from the home screen icon. Data saved in a Safari tab is not shared with the icon.</li><li>Allow Location when asked. In iPhone Settings, keep <b>Precise Location</b> ON for this app.</li></ul></div>';
  $('#app').innerHTML=h;
  $('#sDur').onchange=function(){st.dur=+this.value;saveSettings()};
  $('#sAcc').onchange=function(){st.maxAcc=+this.value;saveSettings()};
  $('#sUnit').onchange=function(){st.unit=this.value;saveSettings()};
  $('#bExp').onclick=function(){var pl=clone(S.plots);pl.forEach(function(p){allRings(p).forEach(function(r){r.forEach(function(c){delete c.ph})})});share('Land Measure backup',JSON.stringify({app:'land-measure',v:2,exported:Date.now(),plots:pl},null,1),'land-measure-backup.json','application/json')};
  $('#bGeoAll').onclick=function(){if(!S.plots.length){toast('No plots yet');return}share('Land plots GeoJSON',geojson(S.plots),'land-plots.geojson','application/geo+json')};
  $('#bKmlAll').onclick=function(){if(!S.plots.length){toast('No plots yet');return}share('Land plots KML',kmlOf(S.plots),'land-plots.kml','application/vnd.google-earth.kml+xml')};
  $('#bImp').onclick=function(){
    sheet('<h3>Import backup</h3><div class="mut small">Pick the backup .json file, or paste its text below.</div><input type="file" id="iFile" accept=".json,application/json" style="margin-top:10px"><textarea id="iTxt" placeholder="Paste backup text here" style="margin-top:10px"></textarea><div class="row"><button class="pri" id="iOk">Import</button><button id="iNo">Cancel</button></div>');
    $('#iNo').onclick=closeSheet;
    $('#iFile').onchange=function(){var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('#iTxt').value=r.result};r.readAsText(f)};
    $('#iOk').onclick=function(){
      try{var j=JSON.parse($('#iTxt').value),arr=Array.isArray(j)?j:j.plots;if(!Array.isArray(arr))throw 0;
        var have={};S.plots.forEach(function(p){have[p.id]=1});var add=0;
        arr.forEach(function(p){if(p&&p.id&&Array.isArray(p.corners)&&p.corners.length>=3&&!have[p.id]){allRings(p).forEach(function(r){r.forEach(function(c){delete c.ph})});S.plots.push(p);add++}});
        S.plots.sort(function(a,b){return b.ts-a.ts});savePlots();closeSheet();toast('Imported '+add+' plot'+(add===1?'':'s'));renderMore();
      }catch(e){toast('That is not a valid backup')}
    };
  };
}

render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
// auto-start GPS if the user has used the app before (permission already granted)
try{if(navigator.permissions&&navigator.permissions.query){navigator.permissions.query({name:'geolocation'}).then(function(r){if(r.state==='granted')startGPS()}).catch(function(){})}}catch(e){}
})();
</script>
</body>
</html>
